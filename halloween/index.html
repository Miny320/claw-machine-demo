<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#262033">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Halloween claw machine reward game. Move the claw, drop it, and grab a toy.">
<title>Halloween Claw Machine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23C4ADF1' stroke='%23151320' stroke-width='6'/%3E%3Cpath d='M20 25 L32 43 L44 25' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #262033;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    touch-action: none;
    visibility: hidden;   /* shown by the script after the first picture is drawn */
  }
  noscript p {
    font-family: sans-serif;
    padding: 24px;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" role="application" aria-label="Claw machine game. Use the left and right arrow keys to move the claw. Press the space bar to drop it and grab a toy.">Your browser cannot show this game.</canvas>
<noscript><p>This game needs JavaScript to run.</p></noscript>

<script>
/*
  Halloween Claw Machine
  ----------------------
  One file, no libraries, no downloads. Everything is drawn on a canvas.
  The toy pictures are stored at the very bottom of this file.

  Controls
    Move:  left and right arrow keys, the two arrow buttons, or tap the glass
    Drop:  space bar, Enter, down arrow, or the DROP button
    Other: M turns the sound on and off, F toggles full screen
*/
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // 1. Settings. These are the numbers most worth tuning.
  // ------------------------------------------------------------------
  var SETTINGS = {
    moveSpeed: 340,     // claw speed while a move button is held (units per second)
    moveAccel: 1700,    // how quickly the claw speeds up
    moveBrake: 3200,    // how quickly the claw stops
    dropSpeed: 440,     // how fast the claw goes down
    liftSpeed: 300,     // how fast the claw comes back up
    carrySpeed: 430,    // how fast the claw carries a toy to the chute
    grabRange: 0.8,     // 1 = grabs when the claw is anywhere above a toy, lower = harder
    autoAlign: true,    // slide the claw over the middle of the toy while it drops
    sound: true,        // sound is on at the start (the player can mute it)
    title: 'PRIZE TIME!',
    startMessage: 'Move the claw, then press DROP!',
    missMessage: 'So close! Try again!',
    winSign: 'WINNER!',
    winMessages: ['Spooktacular!'],
    againLabel: 'Play again'
  };

  // The toy pictures. Each one is stored as text at the bottom of this file,
  // in a block with this id. cx and r say where the round body of the toy
  // sits inside its picture, as fractions of the picture width, and cy as a
  // fraction of its height. The game treats each toy as a circle.
  var TOY_ARTS = [
    { id: 'toy-vampire', cx: 0.556, cy: 0.489, r: 0.43 },
    { id: 'toy-mummy', cx: 0.502, cy: 0.481, r: 0.43 },
    { id: 'toy-werewolf', cx: 0.55, cy: 0.5, r: 0.43 },
    { id: 'toy-monster', cx: 0.48, cy: 0.5, r: 0.45 }
  ];

  // Toys in the machine. r is the size, tilt is how the toy likes to sit,
  // art is its picture (a position in TOY_ARTS).
  // The floor row fills the floor. Each top toy rests in a gap of the floor row.
  var FLOOR_ROW = [
    { r: 65, tilt: -0.16, art: 0 },
    { r: 63, tilt: 0.12, art: 1 },
    { r: 66, tilt: -0.07, art: 2 },
    { r: 64, tilt: 0.2, art: 3 }
  ];
  var TOP_ROW = [
    { gap: 0, r: 62, tilt: 0.1, art: 3 },
    { gap: 2, r: 60, tilt: -0.2, art: 0 }
  ];

  var MAX_DPR = 2;            // never draw sharper than this (keeps old devices fast)
  var MAX_PIXELS = 4200000;   // upper limit for the canvas size in real pixels

  // ------------------------------------------------------------------
  // 2. Colours
  // ------------------------------------------------------------------
  // Halloween: a lavender machine under a big yellow moon, with lime, orange and pink lights.
  // The colours come from the client's screenshot of 2026-10-15.
  var INK = '#151320';
  var COL = {
    wall: '#262033', wallDot: '#363049',
    moon: '#FFFF72', moonDark: '#F3EF5E', moonGlow: '255, 255, 114',
    skirting: '#FDB92D',
    floor: '#ECE8ED',
    body: '#C4ADF1', bodyDark: '#986BE4', bodyLight: '#ED97ED', panel: '#C4ADF1',
    glass: '#FFFFFF', glassBand: '#ECE8ED', glassMark: '#F2AEA0',
    inFloor: '#362654', hole: '#D6F727',
    sign: '#D3D3D3', signDark: '#B4B4B4', plate: '#FDB92D',
    btn: '#FDB92D', btnDark: '#E09F14',
    accent: '#FA7F3D', accentDark: '#D9611F', accentLight: '#FFC79A',
    claw: '#FFFF72', clawLight: '#FFFFC2',
    metal: '#E3E8F0', metalDark: '#A9B3C6',    // the claw fingers and the rail stay silver
    dark: '#242424',
    go: '#986BE4', goDark: '#7A4FC9',
    off: '#8C80A8', offDark: '#6B5F8A',
    white: '#FFFFFF'
  };
  var LIGHTS = ['#D6F727', '#FA7F3D', '#ED97ED'];   // the bulbs on the sign
  // Confetti: paper strips, and little stars, bats and moons.
  var CONFETTI = ['#D6F727', '#FA7F3D', '#ED97ED', '#FFFF72', '#C4ADF1', '#FFFFFF'];
  var CONFETTI_STAR = ['#FFFF72', '#FFFFFF', '#ED97ED'];
  var CONFETTI_BAT = ['#986BE4', '#FA7F3D', '#C4ADF1'];
  var CONFETTI_MOON = ['#FFFF72', '#FFFFFF', '#D6F727'];

  // ------------------------------------------------------------------
  // 3. Layout of the machine, in design units (the machine is 840 x 920)
  // ------------------------------------------------------------------
  var MW = 840, MH = 920;
  var CAB = { x: 20, y: 100, w: 800, h: 772, r: 30 };    // cabinet body
  var GLASS = { x: 50, y: 138, w: 740, h: 540 };         // window with the toys
  var FLOOR_Y = 666;                    // the toys rest on this line
  var CHUTE_L = 50, CHUTE_R = 240;      // prize chute, left part of the window
  var PART = { x: 240, y: 466, w: 9, h: 200 };           // clear wall beside the chute
  var PILE_L = 253, PILE_R = 770;       // side limits for the toys (room for a claw finger on the right)
  var RAIL_Y = 160;
  var PIVOT_Y = RAIL_Y + 18;            // the cable hangs from here
  var HUB_H = 32;                       // height of the claw body
  var HUB_HALF = 30;
  var L_MIN = 22;                       // shortest cable
  var HOME_X = 162;                     // the claw parks above the chute
  var X_MIN = HOME_X, X_MAX = 712;      // how far the claw can travel
  var PANEL_Y = 678;
  var DOOR = { x: 79, y: 724, w: 166, h: 132 };          // prize door
  var BTN = {
    left: { x: 352, y: 784, r: 60 },
    right: { x: 496, y: 784, r: 60 },
    drop: { x: 676, y: 784, r: 72 }
  };
  var SIGN = { x: 110, y: 6, w: 620, h: 120 };
  var PLATE = { x: 134, y: 40, w: 572, h: 54 };
  var SHOW = { x: 420, y: 432, r: 150 };                 // where the prize is shown after a win
  var AGAIN = { x: 420, y: 680, w: 372, h: 100 };        // "Play again" button
  var AGAIN_DELAY = 0.9;

  // One claw finger, described for the right side. The left one is mirrored.
  // Points are measured from the finger hinge.
  var PRONG = { px: 22, py: -9, c1x: 62, c1y: -3, c2x: 77, c2y: 88, tx: 34.7, ty: 120.3 };
  var DEG = Math.PI / 180;
  var GRIP_OPEN = 18 * DEG, GRIP_REST = 7 * DEG, GRIP_SHUT = -21 * DEG;
  var PRONG_W = 19;        // thickness of a finger, with its outline
  var CLOSE_TIME = 0.34;

  var G = 2600;            // gravity for the toys
  var SUB = 1 / 120;       // physics step

  // ------------------------------------------------------------------
  // 4. Small helpers
  // ------------------------------------------------------------------
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hyp(x, y) { return Math.sqrt(x * x + y * y); }
  function approach(v, goal, step) { return v < goal ? Math.min(v + step, goal) : Math.max(v - step, goal); }
  function wrap(a) {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  }
  function easeInOut(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
  function easeOut(u) { return 1 - Math.pow(1 - u, 3); }
  function backOut(u) { var s = 1.70158; u -= 1; return u * u * ((s + 1) * u + s) + 1; }
  function bounceOut(u) {
    var n = 7.5625, d = 2.75;
    if (u < 1 / d) return n * u * u;
    if (u < 2 / d) { u -= 1.5 / d; return n * u * u + 0.75; }
    if (u < 2.5 / d) { u -= 2.25 / d; return n * u * u + 0.9375; }
    u -= 2.625 / d;
    return n * u * u + 0.984375;
  }

  function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
  function oval(c, x, y, rx, ry) {
    c.beginPath();
    c.save();
    c.translate(x, y);
    c.scale(rx, ry);
    c.arc(0, 0, 1, 0, TAU);
    c.restore();
  }
  // Rounded rectangle. r is one number or [top left, top right, bottom right, bottom left].
  function rr(c, x, y, w, h, r) {
    var a = typeof r === 'number' ? [r, r, r, r] : r;
    c.beginPath();
    c.moveTo(x + a[0], y);
    c.lineTo(x + w - a[1], y);
    c.arcTo(x + w, y, x + w, y + a[1], a[1]);
    c.lineTo(x + w, y + h - a[2]);
    c.arcTo(x + w, y + h, x + w - a[2], y + h, a[2]);
    c.lineTo(x + a[3], y + h);
    c.arcTo(x, y + h, x, y + h - a[3], a[3]);
    c.lineTo(x, y + a[0]);
    c.arcTo(x, y, x + a[0], y, a[0]);
    c.closePath();
  }
  function poly(c, pts) {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
  }
  function paint(c, fill, stroke, width) {
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.stroke(); }
  }

  // Little Halloween shapes, used on the wallpaper and in the confetti.
  // A five point star around (x, y). r is the size, k how deep the points cut in.
  function starPath(c, x, y, r, k) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var d = i % 2 ? r * k : r;
      if (i) c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
      else c.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    c.closePath();
  }
  // A crescent moon around (x, y), open to the right.
  function moonPath(c, x, y, r) {
    var d = r * 0.55, r2 = r * 0.8;
    var ix = (r * r - r2 * r2 + d * d) / (2 * d);
    var iy = Math.sqrt(Math.max(r * r - ix * ix, 0));
    var a = Math.atan2(iy, ix), b = Math.atan2(iy, ix - d);
    c.beginPath();
    c.arc(x, y, r, a, TAU - a);
    c.arc(x + d, y, r2, TAU - b, b, true);
    c.closePath();
  }
  // A bat with its wings out, around (x, y). r is half the wingspan.
  function batPath(c, x, y, r) {
    var k = r / 10;
    c.save();
    c.translate(x, y);
    c.scale(k, k);
    c.beginPath();
    c.moveTo(0, 4.2);
    c.quadraticCurveTo(1.8, 4, 2.8, 3);
    c.quadraticCurveTo(4.6, 1.4, 6.4, 1.8);
    c.quadraticCurveTo(8.4, 0.2, 10, -0.8);
    c.quadraticCurveTo(6.6, -3.8, 2.6, -2.6);
    c.lineTo(2.2, -4.8);
    c.quadraticCurveTo(1, -3.4, 0, -3.5);
    c.quadraticCurveTo(-1, -3.4, -2.2, -4.8);
    c.lineTo(-2.6, -2.6);
    c.quadraticCurveTo(-6.6, -3.8, -10, -0.8);
    c.quadraticCurveTo(-8.4, 0.2, -6.4, 1.8);
    c.quadraticCurveTo(-4.6, 1.4, -2.8, 3);
    c.quadraticCurveTo(-1.8, 4, 0, 4.2);
    c.closePath();
    c.restore();
  }

  // Text. The game uses a rounded font when the device has one.
  var FONT = { weight: 'bold', stack: '"Trebuchet MS", "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif' };
  function pickFont() {
    var c = document.createElement('canvas').getContext('2d');
    var probe = 'Claw Machine 0123 mmwwii';
    function has(name) {
      c.font = '48px monospace';
      var mono = c.measureText(probe).width;
      c.font = '48px "' + name + '", monospace';
      var a = c.measureText(probe).width;
      c.font = '48px serif';
      var serif = c.measureText(probe).width;
      c.font = '48px "' + name + '", serif';
      var b = c.measureText(probe).width;
      return a !== mono || b !== serif;
    }
    var wanted = [
      { name: 'Arial Rounded MT Bold', weight: 'normal' },
      { name: 'Chalkboard SE', weight: 'bold' },
      { name: 'Comic Sans MS', weight: 'bold' }
    ];
    for (var i = 0; i < wanted.length; i++) {
      if (has(wanted[i].name)) {
        FONT.weight = wanted[i].weight;
        FONT.stack = '"' + wanted[i].name + '", ' + FONT.stack;
        return;
      }
    }
  }
  function font(px) { return FONT.weight + ' ' + px.toFixed(1) + 'px ' + FONT.stack; }
  // Centred text with an optional outline. Shrinks to fit maxW.
  function drawText(c, str, x, y, px, fill, stroke, width, maxW) {
    c.font = font(px);
    if (maxW) {
      var w = c.measureText(str).width;
      if (w > maxW) {
        var k = maxW / w;
        px *= k;
        if (width) width = Math.max(width * k, width * 0.7);
        c.font = font(px);
      }
    }
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.strokeText(str, x, y); }
    if (fill) { c.fillStyle = fill; c.fillText(str, x, y); }
  }

  // ------------------------------------------------------------------
  // 5. Canvas and screen layout
  // ------------------------------------------------------------------
  var canvas, ctx;
  var back = document.createElement('canvas');    // everything that never moves
  var front = document.createElement('canvas');   // glass shine, drawn over the toys
  var view = { w: 0, h: 0, cw: 0, ch: 0, dprSeen: 1, dpr: 1, s: 1, ox: 0, oy: 0, fx: 0, fy: 0, hud: null, quality: 1 };
  var needResize = true;
  var toyImgs = [], toySprites = [];    // one picture, and one small copy of it, per entry of TOY_ARTS

  // Full screen support differs between browsers.
  var fsRoot = document.documentElement;
  var fsEnter = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen || fsRoot.webkitRequestFullScreen;
  var fsLeave = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
  var fsOk = !!(fsEnter && fsLeave) && document.fullscreenEnabled !== false && document.webkitFullscreenEnabled !== false;
  function fsActive() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFullscreen() {
    if (!fsOk) return;
    try {
      if (fsActive()) {
        fsLeave.call(document);
      } else {
        var p = fsEnter.call(fsRoot);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (err) { /* full screen is optional */ }
  }

  function useDesign(c) {
    var k = view.dpr * view.s;
    c.setTransform(k, 0, 0, k, view.dpr * view.ox, view.dpr * view.oy);
  }
  function useScreen(c) { c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); }

  function resize() {
    view.cw = canvas.clientWidth;
    view.ch = canvas.clientHeight;
    view.dprSeen = window.devicePixelRatio || 1;
    var w = Math.max(160, view.cw || window.innerWidth);
    var h = Math.max(160, view.ch || window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    if (w * h * dpr * dpr > MAX_PIXELS) dpr = Math.sqrt(MAX_PIXELS / (w * h));
    dpr *= view.quality;      // lowered by watchSpeed() on slow devices
    view.w = w;
    view.h = h;
    view.dpr = dpr;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    // Corner buttons.
    var u = clamp(Math.min(w, h) * 0.085, 44, 120);
    var m = Math.round(u * 0.22);
    var padX = 12, padTop = 8, padBottom = 12;
    var s = Math.min((w - 2 * padX) / MW, (h - padTop - padBottom) / MH);
    // If the sign would sit under the corner buttons, keep the top strip free.
    var sideRoom = w / 2 - (SIGN.w / 2) * s;
    var hudWidth = (fsOk ? 2 : 1) * (u + m) + m;
    if (sideRoom < hudWidth) {
      padTop = m + u + 6;
      s = Math.min(s, (h - padTop - padBottom) / MH);
    }
    view.s = s;
    view.ox = (w - MW * s) / 2;
    view.oy = padTop + (h - padTop - padBottom - MH * s) * 0.68;
    view.hud = {
      u: u,
      m: m,
      sound: { x: w - m - u / 2, y: m + u / 2, r: u / 2 },
      full: fsOk ? { x: w - m - u * 1.5 - m * 0.7, y: m + u / 2, r: u / 2 } : null
    };
    buildLayers();
  }

  // The parts that never change are drawn once and reused every frame.
  function buildLayers() {
    var d = view.dpr, s = view.s;
    back.width = canvas.width;
    back.height = canvas.height;
    var b = back.getContext('2d', { alpha: false });
    useScreen(b);
    drawRoom(b);
    useDesign(b);
    drawMachineBack(b);

    var m = 8;
    view.fx = Math.floor((view.ox + (GLASS.x - m) * s) * d);
    view.fy = Math.floor((view.oy + (GLASS.y - m) * s) * d);
    front.width = Math.ceil((GLASS.w + 2 * m) * s * d) + 2;
    front.height = Math.ceil((GLASS.h + 2 * m) * s * d) + 2;
    var f = front.getContext('2d');
    f.setTransform(d * s, 0, 0, d * s, d * view.ox - view.fx, d * view.oy - view.fy);
    drawMachineFront(f);

    buildToySprites();
  }

  // A copy of each toy picture at the size it is shown, so it stays crisp and cheap to draw.
  function buildToySprites() {
    toySprites = [];
    for (var i = 0; i < TOY_ARTS.length; i++) toySprites.push(makeSprite(toyImgs[i], TOY_ARTS[i]));
  }
  function makeSprite(toyImg, art) {
    if (!toyImg) return null;
    var sw = toyImg.naturalWidth, sh = toyImg.naturalHeight;
    var px = Math.ceil((70 / art.r) * view.s * view.dpr);
    px = clamp(px, 24, sw);
    var src = toyImg, c, x;
    while (sw / 2 >= px) {
      c = document.createElement('canvas');
      c.width = Math.round(sw / 2);
      c.height = Math.round(sh / 2);
      x = c.getContext('2d');
      x.imageSmoothingEnabled = true;
      x.imageSmoothingQuality = 'high';
      x.drawImage(src, 0, 0, c.width, c.height);
      src = c;
      sw = c.width;
      sh = c.height;
    }
    c = document.createElement('canvas');
    c.width = px;
    c.height = Math.round(px * toyImg.naturalHeight / toyImg.naturalWidth);
    x = c.getContext('2d');
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(src, 0, 0, c.width, c.height);
    return c;
  }

  // ------------------------------------------------------------------
  // 6. Sound. Short beeps made in code, so there are no sound files.
  // ------------------------------------------------------------------
  var AudioCtor = window.AudioContext || window.webkitAudioContext;
  var snd = { ctx: null, out: null, on: SETTINGS.sound, hum: null, humOn: false };
  try {
    var savedSound = window.localStorage.getItem('clawMachineSound');
    if (savedSound === '0') snd.on = false;
    if (savedSound === '1') snd.on = true;
  } catch (err) { /* storage can be blocked, the default is fine */ }

  // Browsers only allow sound after the player touches something.
  function unlockAudio() {
    if (!AudioCtor) return;
    try {
      if (!snd.ctx) {
        snd.ctx = new AudioCtor();
        snd.out = snd.ctx.createGain();
        snd.out.gain.value = snd.on ? 0.6 : 0;
        snd.out.connect(snd.ctx.destination);
      }
      if (snd.ctx.state === 'suspended') {
        var wake = snd.ctx.resume();
        if (wake && wake.catch) wake.catch(function () {});
      }
    } catch (err) {
      snd.ctx = null;
      AudioCtor = null;
    }
  }
  function beep(freq, delay, dur, type, vol, slideTo) {
    var a = snd.ctx;
    if (!a || !snd.on || (a.state && a.state !== 'running')) return;
    try {
      var t0 = a.currentTime + delay;
      var osc = a.createOscillator();
      var gain = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(snd.out);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (err) { /* sound is optional */ }
  }

  // Finger tip position for a given opening angle, measured from the palm.

  // 10. Game logic

  // Move the trolley toward a wanted speed, with smooth starts and stops.
  function driveTrolley(want, dt) {

    claw.x += claw.v * dt;

      driveTo(claw.goalX, SETTINGS.moveSpeed, dt);
      if (Math.abs(claw.goalX - claw.x) < 0.6 && Math.abs(claw.v) < 8) claw.goalX = null;
    } else {

  function tryDrop() {

  function updateDrop(dt) {

      claw.holdDx = t.x - p.x;
      claw.holdDy = t.y - (p.y + t.r + 2);

      claw.holdAngle = t.angle - claw.sway;

  function updateClose(dt) {

    }

  function updateCarry(dt) {

      game.arrived = game.t;
    }
    if (game.arrived >= 0 && game.t - game.arrived > 0.35) {
      game.released = false;
      claw.gripFrom = claw.grip;
      setState('releasing');
    }
  }

  function updateRelease(dt) {
    driveTrolley(0, dt);
    var u = clamp(game.t / 0.24, 0, 1);
    claw.grip = lerp(claw.gripFrom, GRIP_OPEN, easeOut(u));
    if (!game.released && u >= 0.45) {
      game.released = true;
      var b = claw.held;
      claw.held = null;
      claw.target = null;
      balls.splice(balls.indexOf(b), 1);
      b.held = false;
      prize = b;
      prize.phase = 'fall';
      prize.vy = 0;
      prize.spin = 0.9;
      sfx.fall();
    }
    if (game.released && prize && prize.y - prize.r > GLASS.y + GLASS.h + 8) {
      prize.phase = 'tray';
      prize.trayR = Math.min(prize.r, 60);
      prize.trayY = DOOR.y - prize.trayR - 4;
      prize.trayFrom = wrap(prize.angle);
      game.thud = false;
      setState('tray');
    }
  }

  // The prize lands behind the prize door.
  function updateTray(dt) {
    claw.grip = approach(claw.grip, GRIP_REST, 1.6 * dt);
    driveTrolley(0, dt);
    var u = clamp((game.t - 0.2) / 0.6, 0, 1);
    var restY = DOOR.y + DOOR.h - prize.trayR - 12;
    prize.trayY = lerp(DOOR.y - prize.trayR - 4, restY, bounceOut(u));
    prize.angle = lerp(prize.trayFrom, -0.14, easeOut(u));
    if (!game.thud && u > 0.36) {
      game.thud = true;
      prize.sqV += 9;
      sfx.thud();
    }
    if (game.t > 1.25) startWin();
  }

  function startWin() {
    var list = SETTINGS.winMessages;
    game.winMsg = list[Math.floor(Math.random() * list.length)];
    prize.phase = 'show';
    prize.showFrom = wrap(prize.angle);
    setState('win');
    setSign(SETTINGS.winSign);
    sfx.win();
    burst(70);
  }
  function playAgain() {
    if (game.state !== 'win' || game.t < AGAIN_DELAY) return;
    touchAct();
    sfx.pop();
    setState('winOut');
  }
  function finishRound() {
    game.won++;
    prize = null;
    setSign(SETTINGS.title);
    if (balls.length === 0) {
      fillMachine();
      setState('intro');
    } else {
      setState('ready');
    }
  }

  // The hanging claw swings a little when the trolley speeds up or stops.
  function updateSway(dt, acc) {
    var len = claw.L + 80;
    var stiff = 2600 / len;
    var damp = (game.state === 'dropping' || game.state === 'closing') ? 11 : 3.2;
    var idle = canSteer() ? 0.016 * Math.sin(game.time * 1.9) : 0;
    acc = clamp(acc, -6000, 6000);
    claw.swayV += (-stiff * (claw.sway - idle) - damp * claw.swayV + acc * 0.2 / len) * dt;
    claw.sway = clamp(claw.sway + claw.swayV * dt, -0.3, 0.3);
  }

  // Keep the grabbed toy inside the claw.
  function placeHeld() {
    var b = claw.held;
    if (!b) return;
    var p = holdPos(b.r);
    var k = 0;      // 1 = just grabbed, 0 = sitting in the middle of the claw
    if (game.state === 'closing') k = 1;
    else if (game.state === 'lifting') k = 1 - easeInOut(clamp((claw.holdL - claw.L) / 90, 0, 1));
    b.x = p.x + claw.holdDx * k;
    b.y = p.y + claw.holdDy * k;
    b.angle = claw.holdAngle + claw.sway;
    b.vx = 0;
    b.vy = 0;
    b.spin = 0;
  }

  // One small physics step for the pile of toys. The toys are circles.
  function stepPile(dt) {
    var n = balls.length, i, j, it, b, o;
    var drag = Math.exp(-0.5 * dt), rub = Math.exp(-5 * dt);
    for (i = 0; i < n; i++) {
      b = balls[i];
      b.onFloor = false;
      b.touch = false;
      if (b.held) continue;
      b.vy += G * dt;
      b.vx *= drag;
      b.vy *= drag;
      b.pvy = b.vy;
      b.pv = hyp(b.vx, b.vy);
      b.px = b.x;
      b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
    for (it = 0; it < 8; it++) {
      // toys push each other apart
      for (i = 0; i < n; i++) {
        b = balls[i];
        for (j = i + 1; j < n; j++) {
          o = balls[j];
          if (b.held && o.held) continue;
          var dx = o.x - b.x, dy = o.y - b.y, reach = b.r + o.r;
          var d2 = dx * dx + dy * dy;
          if (d2 >= reach * reach) continue;
          var d = Math.sqrt(d2), nx = 0, ny = -1;
          if (d > 0.0001) { nx = dx / d; ny = dy / d; }
          var pen = reach - d;
          var wb = b.held ? 0 : (o.held ? 1 : 0.5);
          var wo = o.held ? 0 : (b.held ? 1 : 0.5);
          b.x -= nx * pen * wb;
          b.y -= ny * pen * wb;
          o.x += nx * pen * wo;
          o.y += ny * pen * wo;
          b.touch = true;
          o.touch = true;
        }
      }
      // walls and floor
      for (i = 0; i < n; i++) {
        b = balls[i];
        if (b.held) continue;
        if (b.x < PILE_L + b.r) b.x = PILE_L + b.r;
        if (b.x > PILE_R - b.r) b.x = PILE_R - b.r;
        if (b.y > FLOOR_Y - b.r) { b.y = FLOOR_Y - b.r; b.onFloor = true; }
      }
    }
    var moving = false, fast = 0;
    for (i = 0; i < n; i++) {
      b = balls[i];
      if (b.held) continue;
      var vx = (b.x - b.px) / dt, vy = (b.y - b.py) / dt;
      if (b.onFloor && b.pvy > 260) {
        vy = -b.pvy * 0.28;                         // small bounce
        b.sqV += Math.min(b.pvy / 60, 14);          // and a squash
      }
      if (b.onFloor || b.touch) vx *= rub;
      // A push may speed a toy up only a little, so nothing ever shoots away.
      var sp = hyp(vx, vy);
      if (sp > b.pv + 420) {
        vx *= (b.pv + 420) / sp;
        vy *= (b.pv + 420) / sp;
      }
      b.vx = vx;
      b.vy = vy;
      // Rolling toys turn. Resting toys wobble back to their favourite tilt.
      var lean = wrap(b.tilt - b.angle);
      if (Math.abs(vx) + Math.abs(vy) > 40) {
        if (b.onFloor || b.touch) b.spin += (vx / b.r - b.spin) * Math.min(1, 10 * dt);
      } else {
        b.spin += (lean * 34 - b.spin * 5.5) * dt;
      }
      b.angle += b.spin * dt;
      fast = Math.max(fast, vx * vx + vy * vy);
      if (vx * vx + vy * vy > 16 || Math.abs(b.spin) > 0.06 || Math.abs(lean) > 0.015) moving = true;
    }
    pile.fast = fast;
    if (moving) {
      pile.calm = 0;
    } else {
      pile.calm += dt;
      if (pile.calm > 0.35) pile.awake = false;     // nothing moves: stop computing
    }
  }

  function updatePile(dt) {
    var i, b, h = claw.held;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      b.sqV += (-260 * b.sq - 15 * b.sqV) * dt;
      b.sq = clamp(b.sq + b.sqV * dt, -1, 1);
      b.wig = approach(b.wig, (b === claw.target && game.state === 'ready') ? 1 : 0, 6 * dt);
    }
    if (!pile.awake) {
      if (h) { h.lastX = h.x; h.lastY = h.y; }
      return;
    }
    pile.acc += dt;
    var n = Math.min(8, Math.floor(pile.acc / SUB));
    pile.acc -= n * SUB;
    if (pile.acc > SUB) pile.acc = 0;
    if (n === 0) return;
    // The grabbed toy moves with the claw. Spread its move over the small steps.
    var hx = 0, hy = 0;
    if (h) { hx = h.x; hy = h.y; }
    for (i = 1; i <= n; i++) {
      if (h) { h.x = lerp(h.lastX, hx, i / n); h.y = lerp(h.lastY, hy, i / n); }
      stepPile(SUB);
    }
    if (h) { h.x = hx; h.y = hy; h.lastX = hx; h.lastY = hy; }
  }

  function updatePrize(dt) {
    var p = prize;
    if (!p) return;
    p.sqV += (-260 * p.sq - 15 * p.sqV) * dt;
    p.sq = clamp(p.sq + p.sqV * dt, -1, 1);
    if (p.phase !== 'fall') return;
    p.vy += G * dt;
    p.y += p.vy * dt;
    p.angle += p.spin * dt;
    p.x = clamp(p.x, CHUTE_L + p.r + 2, CHUTE_R - p.r - 2);
  }

  // Confetti lives in design units so it scales with the machine.
  // Most pieces are paper strips. The rest are stars, bats and moons.
  function addConfetti(x, y, vx, vy) {
    var u = Math.random();
    var kind = u < 0.4 ? 0 : (u < 0.6 ? 1 : (u < 0.9 ? 2 : 3));   // 0 strip, 1 star, 2 bat, 3 moon
    var cols = [CONFETTI, CONFETTI_STAR, CONFETTI_BAT, CONFETTI_MOON][kind];
    confetti.push({
      kind: kind,
      x: x, y: y, vx: vx, vy: vy,
      w: 12 + Math.random() * 12, h: 7 + Math.random() * 7,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 9,
      flip: Math.random() * TAU, vf: 5 + Math.random() * 7,
      col: cols[Math.floor(Math.random() * cols.length)]
    });
  }
  function burst(count) {
    for (var i = 0; i < count; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
      var sp = 380 + Math.random() * 620;
      addConfetti(SHOW.x, SHOW.y, Math.cos(a) * sp, Math.sin(a) * sp);
    }
  }
  function updateConfetti(dt) {
    var bottom = (view.h - view.oy) / view.s + 30, i, p;
    if (game.state === 'win' && confetti.length < 90 && Math.random() < dt * 14) {
      var x0 = -view.ox / view.s, x1 = (view.w - view.ox) / view.s;
      addConfetti(lerp(x0, x1, Math.random()), -view.oy / view.s - 20, (Math.random() - 0.5) * 60, 120 + Math.random() * 120);
    }
    for (i = confetti.length - 1; i >= 0; i--) {
      p = confetti[i];
      p.vy += 620 * dt;
      p.vx *= Math.exp(-1.6 * dt);
      p.vy = Math.min(p.vy * Math.exp(-0.9 * dt), 430);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.flip += p.vf * dt;
      if (p.y > bottom) confetti.splice(i, 1);
    }
  }

  function update(dt) {
    var v0 = claw.v;
    game.time += dt;
    game.t += dt;
    input.left = keys.left || holding('left') || game.time < tapUntil.left;
    input.right = keys.right || holding('right') || game.time < tapUntil.right;

    switch (game.state) {
      case 'intro':
        steer(dt);
        claw.target = null;
        if (!pile.awake || (game.t > 1 && pile.fast < 900) || game.t > 3) setState('ready');
        break;
      case 'ready':
        steer(dt);
        claw.grip = approach(claw.grip, GRIP_REST, 1.6 * dt);
        claw.target = findTarget(claw.x);
        break;
      case 'dropping': updateDrop(dt); break;
      case 'closing': updateClose(dt); break;
      case 'lifting': updateLift(dt); break;
      case 'carrying': updateCarry(dt); break;
      case 'releasing': updateRelease(dt); break;
      case 'tray': updateTray(dt); break;
      case 'win':
      case 'winOut':
        claw.grip = approach(claw.grip, GRIP_REST, 1.6 * dt);
        driveTrolley(0, dt);
        if (game.state === 'winOut' && game.t >= 0.45) finishRound();
        break;
    }

    updateSway(dt, (claw.v - v0) / dt);
    placeHeld();
    updatePile(dt);
    updatePrize(dt);
    updateConfetti(dt);

    sign.t += dt;
    if (sign.until && game.time > sign.until) setSign(SETTINGS.title);

    var s = game.state;
    setHum(Math.abs(claw.v) > 14 && (s === 'ready' || s === 'intro' || s === 'carrying') && !document.hidden);
  }

  // ------------------------------------------------------------------
  // 11. Drawing: the parts that never move
  // ------------------------------------------------------------------
  function drawRoom(c) {
    var w = view.w, h = view.h, s = view.s;
    var floorTop = view.oy + 886 * s;
    c.fillStyle = COL.wall;
    c.fillRect(0, 0, w, h);
    // dotted wallpaper
    var step = 104 * s, rad = 9 * s, row = 0, x, y, i;
    c.fillStyle = COL.wallDot;
    for (y = (view.oy % (step / 2)) - step; y < floorTop; y += step / 2, row++) {
      for (x = (view.ox % step) - step + (row % 2 ? step / 2 : 0); x < w + step; x += step) {
        circle(c, x, y, rad);
        c.fill();
      }
    }
    // full moon behind the machine, with a soft glow and a few craters
    var mx = view.ox + 420 * s, my = view.oy + 440 * s, mr = 600 * s;
    var craters = [[-40, 300, 34], [-90, 560, 24], [880, 250, 30], [910, 520, 22], [300, -80, 26], [580, -110, 18]];
    circle(c, mx, my, mr + 90 * s);
    c.fillStyle = 'rgba(' + COL.moonGlow + ', 0.06)';
    c.fill();
    circle(c, mx, my, mr + 40 * s);
    c.fillStyle = 'rgba(' + COL.moonGlow + ', 0.1)';
    c.fill();
    circle(c, mx, my, mr);
    c.fillStyle = COL.moon;
    c.fill();
    c.fillStyle = COL.moonDark;
    for (i = 0; i < craters.length; i++) {
      circle(c, view.ox + craters[i][0] * s, view.oy + craters[i][1] * s, craters[i][2] * s);
      c.fill();
    }
    // skirting board and floor
    c.fillStyle = COL.skirting;
    c.fillRect(0, floorTop - 30 * s, w, 30 * s);
    c.fillStyle = INK;
    c.fillRect(0, floorTop - 32 * s, w, 4 * s);
    c.fillStyle = COL.floor;
    c.fillRect(0, floorTop, w, Math.max(0, h - floorTop));
    c.fillStyle = INK;
    c.fillRect(0, floorTop - 2.5 * s, w, 5 * s);
  }

  function drawMachineBack(c) {
    c.lineJoin = 'round';
    c.lineCap = 'round';

    // shadow on the floor
    oval(c, 420, 904, 424, 18);
    c.fillStyle = 'rgba(0, 0, 0, 0.14)';
    c.fill();

    // feet
    rr(c, 62, 884, 100, 28, 10);
    paint(c, COL.bodyDark, INK, 5);
    rr(c, 678, 884, 100, 28, 10);
    paint(c, COL.bodyDark, INK, 5);

    // sign on top
    rr(c, SIGN.x, SIGN.y, SIGN.w, SIGN.h, [56, 56, 0, 0]);
    paint(c, COL.sign, INK, 6);
    rr(c, PLATE.x, PLATE.y, PLATE.w, PLATE.h, PLATE.h / 2);
    paint(c, COL.plate, INK, 5);

    // cabinet body and control panel
    rr(c, CAB.x, CAB.y, CAB.w, CAB.h, CAB.r);
    paint(c, COL.body, null, 0);
    c.save();
    c.clip();
    c.fillStyle = COL.panel;
    c.fillRect(CAB.x, PANEL_Y, CAB.w, CAB.y + CAB.h - PANEL_Y);
    c.fillStyle = COL.bodyLight;
    c.fillRect(CAB.x, PANEL_Y, CAB.w, 18);
    c.fillStyle = INK;
    c.fillRect(CAB.x, PANEL_Y - 2.5, CAB.w, 5);
    c.fillRect(CAB.x, PANEL_Y + 16.5, CAB.w, 3.5);
    c.restore();
    rr(c, CAB.x, CAB.y, CAB.w, CAB.h, CAB.r);
    paint(c, null, INK, 6);

    // small details on the frame
    rr(c, 30, 160, 9, 250, 4.5);
    paint(c, COL.bodyDark, null, 0);
    rr(c, 30, 424, 9, 46, 4.5);
    paint(c, COL.bodyDark, null, 0);
    rr(c, 801, 380, 9, 270, 4.5);
    paint(c, COL.bodyDark, null, 0);
    circle(c, 66, 119, 5);
    paint(c, COL.bodyDark, null, 0);
    circle(c, 774, 119, 5);
    paint(c, COL.bodyDark, null, 0);

    // plinth
    rr(c, 8, 856, 824, 40, 14);
    paint(c, COL.bodyDark, INK, 6);

    // inside of the window
    c.save();
    c.beginPath();
    c.rect(GLASS.x, GLASS.y, GLASS.w, GLASS.h);
    c.clip();
    c.fillStyle = COL.glass;
    c.fillRect(GLASS.x, GLASS.y, GLASS.w, GLASS.h);
    c.fillStyle = COL.glassBand;
    poly(c, [[430, 138], [570, 138], [264, 678], [124, 678]]);
    c.fill();
    poly(c, [[650, 138], [706, 138], [400, 678], [344, 678]]);
    c.fill();
    // arrows that show where the prize goes
    c.strokeStyle = COL.glassMark;
    c.lineWidth = 11;
    for (var i = 0; i < 3; i++) {
      var ay = 506 + i * 44;
      c.beginPath();
      c.moveTo(HOME_X - 28, ay - 13);
      c.lineTo(HOME_X, ay + 13);
      c.lineTo(HOME_X + 28, ay - 13);
      c.stroke();
    }
    c.fillStyle = 'rgba(21, 19, 32, 0.09)';
    c.fillRect(GLASS.x, GLASS.y, GLASS.w, 12);
    // floor under the toys and the hole of the chute
    c.fillStyle = COL.inFloor;
    c.fillRect(PART.x + PART.w / 2, FLOOR_Y, GLASS.x + GLASS.w - PART.x, 20);
    c.fillStyle = INK;
    c.fillRect(PART.x + PART.w / 2, FLOOR_Y - 2, GLASS.x + GLASS.w - PART.x, 4);
    rr(c, HOME_X - 74, 646, 148, 80, 22);
    paint(c, COL.hole, INK, 4);
    // rail for the trolley
    rr(c, 60, RAIL_Y - 7, 720, 14, 7);
    paint(c, COL.metal, INK, 3.5);
    rr(c, 52, RAIL_Y - 14, 14, 28, 4);
    paint(c, COL.metalDark, INK, 3.5);
    rr(c, 774, RAIL_Y - 14, 14, 28, 4);
    paint(c, COL.metalDark, INK, 3.5);
    c.restore();

    // prize door
    drawText(c, 'PRIZE', DOOR.x + DOOR.w / 2, 711, 21, INK, null, 0, 150);
    rr(c, DOOR.x, DOOR.y, DOOR.w, DOOR.h, 16);
    paint(c, COL.hole, INK, 5);
  }

  function drawMachineFront(c) {
    c.lineJoin = 'round';
    c.lineCap = 'round';
    c.save();
    c.beginPath();
    c.rect(GLASS.x, GLASS.y, GLASS.w, GLASS.h);
    c.clip();
    // clear wall beside the chute
    rr(c, PART.x, PART.y, PART.w, PART.h + 20, 4.5);
    paint(c, 'rgba(255, 255, 255, 0.62)', INK, 3.5);
    // shine on the glass
    c.fillStyle = 'rgba(255, 255, 255, 0.28)';
    poly(c, [[130, 138], [236, 138], [50, 375], [50, 240]]);
    c.fill();
    c.fillStyle = 'rgba(255, 255, 255, 0.2)';
    poly(c, [[272, 138], [306, 138], [50, 464], [50, 421]]);
    c.fill();
    c.restore();
    c.lineJoin = 'miter';
    c.strokeStyle = INK;
    c.lineWidth = 5;
    c.strokeRect(GLASS.x, GLASS.y, GLASS.w, GLASS.h);
    c.lineJoin = 'round';
  }

  // ------------------------------------------------------------------
  // 12. Drawing: the parts that move
  // ------------------------------------------------------------------
  // Draw one toy. art is its picture, (x, y) is the middle of its round body,
  // r its size. sq squashes it a little, keeping its bottom in place.
  function drawToy(c, art, x, y, r, angle, sq, sharp) {
    var sy = 1 - 0.09 * sq, sx = 1 + 0.09 * sq;
    var toyImg = toyImgs[art], where = TOY_ARTS[art];
    c.save();
    c.translate(x, y + r * (1 - sy));
    c.scale(sx, sy);
    c.rotate(angle);
    if (toyImg) {
      var src = (sharp || !toySprites[art]) ? toyImg : toySprites[art];
      var w = r / where.r;
      var h = w * toyImg.naturalHeight / toyImg.naturalWidth;
      c.drawImage(src, -where.cx * w, -where.cy * h, w, h);
    } else {
      // plain ball, only used if the picture could not be loaded
      circle(c, 0, 0, r - 2);
      paint(c, '#FAFBFD', INK, 4);
      circle(c, -r * 0.2, r * 0.15, r * 0.08);
      paint(c, INK, null, 0);
      circle(c, r * 0.25, r * 0.15, r * 0.08);
      paint(c, INK, null, 0);
      c.beginPath();
      c.arc(r * 0.02, r * 0.26, r * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
      paint(c, null, INK, 4);
    }
    c.restore();
  }

  // Toys lower in the pile are drawn first. A toy in the claw keeps the
  // place it had when it was grabbed.
  function depthOf(b) { return Math.round((b.y + b.r) / 14); }
  function byDepth(a, b) {
    var la = a.held ? a.depth : depthOf(a), lb = b.held ? b.depth : depthOf(b);
    if (la !== lb) return lb - la;
    return b.x - a.x;
  }
  function drawToys(c) {
    var list = balls.slice().sort(byDepth);
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var wave = b.wig > 0 ? Math.sin(game.time * 11) * b.wig : 0;
      drawToy(c, b.art, b.x, b.y, b.r * (1 + 0.025 * b.wig), b.angle + wave * 0.075, b.sq, false);
    }
    if (prize && prize.phase === 'fall') drawToy(c, prize.art, prize.x, prize.y, prize.r, prize.angle, prize.sq, false);
  }

  // Dots that show where the claw will come down.
  function drawGuide(c) {
    if (!canSteer()) return;
    var from = PIVOT_Y + claw.L + HUB_H + 130;
    var to = (claw.target ? claw.target.y - claw.target.r : surfaceBelow(claw.x)) - 10;
    if (to - from < 16) return;
    c.save();
    c.strokeStyle = claw.target ? 'rgba(237, 151, 237, 0.95)' : 'rgba(237, 151, 237, 0.5)';
    c.lineWidth = 6;
    c.lineCap = 'round';
    c.setLineDash([0.1, 17]);
    c.lineDashOffset = -game.time * 34;
    c.beginPath();
    c.moveTo(claw.x, from);
    c.lineTo(claw.x, to);
    c.stroke();
    c.restore();
  }

  function drawProng(c, side) {
    c.save();
    c.scale(side, 1);
    c.translate(PRONG.px, PRONG.py);
    c.rotate(-claw.grip);
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(PRONG.c1x, PRONG.c1y, PRONG.c2x, PRONG.c2y, PRONG.tx, PRONG.ty);
    c.lineCap = 'round';
    c.strokeStyle = INK;
    c.lineWidth = PRONG_W;
    c.stroke();
    c.strokeStyle = COL.metal;
    c.lineWidth = PRONG_W - 8.5;
    c.stroke();
    circle(c, PRONG.tx, PRONG.ty, TIP_PAD);
    paint(c, COL.claw, INK, 3.5);
    c.restore();
  }

  function drawClaw(c) {
    c.save();
    c.translate(claw.x, PIVOT_Y);
    c.rotate(claw.sway);
    // cable
    c.strokeStyle = INK;
    c.lineWidth = 6;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, -4);
    c.lineTo(0, claw.L);
    c.stroke();
    // fingers and body, measured from the palm
    c.translate(0, claw.L + HUB_H);
    drawProng(c, 1);
    drawProng(c, -1);
    rr(c, -7.5, -HUB_H - 8, 15, 14, 3);
    paint(c, COL.metalDark, INK, 4);
    rr(c, -39, -HUB_H, 78, 30, 13);
    paint(c, COL.claw, INK, 5);
    c.strokeStyle = COL.clawLight;
    c.lineWidth = 5;
    c.beginPath();
    c.moveTo(-25, -HUB_H + 9);
    c.lineTo(-10, -HUB_H + 9);
    c.stroke();
    circle(c, -22, -9, 5.5);
    paint(c, COL.metal, INK, 3.5);
    circle(c, 22, -9, 5.5);
    paint(c, COL.metal, INK, 3.5);
    rr(c, -17, -4, 34, 9, 4.5);
    paint(c, COL.dark, INK, 4);
    c.restore();

    // trolley on the rail
    rr(c, claw.x - 50, RAIL_Y - 19, 100, 38, 12);
    paint(c, COL.claw, INK, 5);
    c.strokeStyle = COL.clawLight;
    c.lineWidth = 5;
    c.beginPath();
    c.moveTo(claw.x - 34, RAIL_Y - 10);
    c.lineTo(claw.x - 14, RAIL_Y - 10);
    c.stroke();
    circle(c, claw.x - 26, RAIL_Y + 4, 7);
    paint(c, COL.metal, INK, 3.5);
    circle(c, claw.x + 26, RAIL_Y + 4, 7);
    paint(c, COL.metal, INK, 3.5);
    rr(c, claw.x - 10, RAIL_Y + 13, 20, 11, 4);
    paint(c, COL.dark, INK, 4);
  }

  // Lights and words on the sign.
  function drawSign(c) {
    var fast = game.state === 'win';
    var phase = Math.floor(game.time * (fast ? 7 : 2.2)), i, lit;
    for (i = 0; i < 11; i++) {
      lit = fast ? (i + phase) % 3 === 0 : (i + phase) % 2 === 0;
      circle(c, 170 + i * 50, 24, 7.5);
      paint(c, LIGHTS[i % LIGHTS.length], INK, 3);
      if (lit) {                      // a bulb that is on gets a bright spot
        circle(c, 170 + i * 50, 24, 3.2);
        paint(c, COL.white, null, 0);
      }
    }
    c.save();
    c.beginPath();
    c.rect(PLATE.x + 3, PLATE.y + 3, PLATE.w - 6, PLATE.h - 6);
    c.clip();
    var a = clamp(sign.t / 0.3, 0, 1);
    drawText(c, sign.text, PLATE.x + PLATE.w / 2, PLATE.y + PLATE.h / 2 + 2 + (1 - backOut(a)) * 48, 38, COL.white, INK, 8, 510);
    c.restore();
  }

  function drawButton(c, b, kind, pressed, live, pulse) {
    var lift = pressed ? 2 : 9;
    var top = !live ? COL.off : (kind === 'drop' ? COL.accent : COL.btn);
    var side = !live ? COL.offDark : (kind === 'drop' ? COL.accentDark : COL.btnDark);
    c.save();
    c.translate(b.x, b.y);
    if (pulse > 0) c.scale(1 + 0.05 * pulse, 1 + 0.05 * pulse);
    circle(c, 0, 0, b.r);
    paint(c, side, INK, 5);
    c.translate(0, -lift);
    circle(c, 0, 0, b.r);
    paint(c, top, INK, 5);
    c.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    c.lineWidth = 6;
    c.beginPath();
    c.arc(0, 0, b.r - 13, Math.PI * 1.13, Math.PI * 1.4);
    c.stroke();
    c.globalAlpha = live ? 1 : 0.75;
    if (kind === 'drop') {
      poly(c, [[-11, -48], [11, -48], [11, -24], [31, -24], [0, 8], [-31, -24], [-11, -24]]);
      paint(c, COL.white, INK, 5.5);
      drawText(c, 'DROP', 0, 37, 29, COL.white, INK, 7, 104);
    } else {
      var d = kind === 'left' ? -1 : 1;
      poly(c, [[d * 27, 0], [-d * 17, -29], [-d * 17, 29]]);
      paint(c, COL.white, INK, 5.5);
    }
    c.restore();
  }
  function drawButtons(c) {
    var ready = game.state === 'ready';
    var idle = game.time - game.lastAct;
    var beat = 0.5 + 0.5 * Math.sin(game.time * 5.5);
    var hintMove = ready && !claw.target && idle > 2.5 ? beat : 0;
    var hintDrop = ready && claw.target ? beat : 0;
    var goRight = claw.x < 440;
    drawButton(c, BTN.left, 'left', input.left && canSteer(), canSteer(), goRight ? 0 : hintMove);
    drawButton(c, BTN.right, 'right', input.right && canSteer(), canSteer(), goRight ? hintMove : 0);
    drawButton(c, BTN.drop, 'drop', holding('drop') || game.time - game.dropFlash < 0.16, ready, hintDrop);
  }

  // The prize behind the prize door.
  function drawTray(c) {
    if (game.state !== 'tray' || !prize) return;
    c.save();
    rr(c, DOOR.x, DOOR.y, DOOR.w, DOOR.h, 16);
    c.clip();
    drawToy(c, prize.art, DOOR.x + DOOR.w / 2, prize.trayY, prize.trayR, prize.angle, prize.sq, false);
    c.restore();
    rr(c, DOOR.x, DOOR.y, DOOR.w, DOOR.h, 16);
    paint(c, null, INK, 5);
  }

  // The celebration after a win.
  function drawWin(c) {
    var s = game.state;
    if (s !== 'win' && s !== 'winOut') {
      if (confetti.length) drawConfetti(c);
      return;
    }
    var t = game.t, p = prize;
    var out = s === 'winOut' ? easeInOut(clamp(t / 0.45, 0, 1)) : 0;
    var fade = s === 'win' ? clamp(t / 0.3, 0, 1) : 1 - out;

    // dark veil over the whole screen
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = 'rgba(22, 14, 44, ' + (0.78 * fade).toFixed(3) + ')';
    c.fillRect(0, 0, canvas.width, canvas.height);
    c.restore();

    // where the prize is right now
    var x, y, r, ang;
    if (s === 'win') {
      var u = clamp(t / 0.7, 0, 1);
      x = lerp(DOOR.x + DOOR.w / 2, SHOW.x, easeOut(u));
      y = lerp(p.trayY, SHOW.y, easeOut(u)) + Math.sin(t * 2.3) * 7 * u;
      r = lerp(p.trayR, SHOW.r, backOut(u));
      ang = lerp(p.showFrom, 0, easeOut(u)) + Math.sin(t * 1.7) * 0.06 * u;
    } else {
      // the prize floats up and shrinks away
      x = SHOW.x;
      y = SHOW.y - 60 * out;
      r = Math.max(SHOW.r * (1 - out), 1);
      ang = 0;
    }

    // rays behind the prize
    c.save();
    c.globalAlpha = fade;
    c.translate(x, y);
    c.rotate(game.time * 0.28);
    for (var i = 0; i < 12; i++) {
      c.rotate(TAU / 12);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(2600, -342);
      c.lineTo(2600, 342);
      c.closePath();
      c.fillStyle = i % 2 ? 'rgba(255, 255, 255, 0.08)' : 'rgba(255, 255, 114, 0.16)';
      c.fill();
    }
    c.restore();
    c.save();
    c.globalAlpha = fade * 0.22;
    circle(c, x, y, r + 34);
    paint(c, COL.white, null, 0);
    c.restore();

    drawToy(c, p.art, x, y, r, ang, p.sq, true);

    if (s === 'win') {
      // message
      var a = clamp((t - 0.3) / 0.45, 0, 1);
      if (a > 0) {
        c.save();
        c.translate(SHOW.x, 190);
        c.rotate(Math.sin(t * 2.1) * 0.025);
        c.scale(backOut(a), backOut(a));
        drawText(c, game.winMsg, 0, 7, 96, null, INK, 22, 720);
        drawText(c, game.winMsg, 0, 0, 96, COL.white, INK, 15, 720);
        c.restore();
      }
      // play again button
      var b = clamp((t - AGAIN_DELAY) / 0.35, 0, 1);
      if (b > 0) {
        var k = backOut(b) * (1 + 0.03 * Math.sin(t * 5));
        var down = holding('again') ? 5 : 0;
        c.save();
        c.translate(AGAIN.x, AGAIN.y);
        c.scale(k, k);
        rr(c, -AGAIN.w / 2, -AGAIN.h / 2 + 9, AGAIN.w, AGAIN.h, AGAIN.h / 2);
        paint(c, COL.goDark, INK, 6);
        rr(c, -AGAIN.w / 2, -AGAIN.h / 2 + down, AGAIN.w, AGAIN.h, AGAIN.h / 2);
        paint(c, COL.go, INK, 6);
        drawText(c, SETTINGS.againLabel, 0, 3 + down, 50, COL.white, INK, 10, AGAIN.w - 70);
        c.restore();
      }
    }
    drawConfetti(c);
  }
  function drawConfetti(c) {
    for (var i = 0; i < confetti.length; i++) {
      var p = confetti[i];
      c.save();
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      c.scale(1, Math.cos(p.flip));
      c.fillStyle = p.col;
      if (p.kind === 1) { starPath(c, 0, 0, p.w * 0.62, 0.5); c.fill(); }
      else if (p.kind === 2) { batPath(c, 0, 0, p.w * 0.95); c.fill(); }
      else if (p.kind === 3) { moonPath(c, 0, 0, p.w * 0.55); c.fill(); }
      else c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      c.restore();
    }
  }

  // Corner buttons, in screen pixels.
  function drawHud(c) {
    var h = view.hud, k = h.u / 60, q, i;
    c.lineJoin = 'round';
    c.lineCap = 'round';

    // sound button
    q = h.sound;
    circle(c, q.x, q.y, q.r - 2 * k);
    paint(c, COL.white, INK, 3.5 * k);
    c.save();
    c.translate(q.x, q.y);
    c.scale(k, k);
    poly(c, [[-15, -6], [-8, -6], [1, -14], [1, 14], [-8, 6], [-15, 6]]);
    paint(c, INK, INK, 2);
    c.strokeStyle = INK;
    c.lineWidth = 3.6;
    if (snd.on) {
      c.beginPath();
      c.arc(2, 0, 8, -0.95, 0.95);
      c.stroke();
      c.beginPath();
      c.arc(2, 0, 14.5, -0.95, 0.95);
      c.stroke();
    } else {
      c.beginPath();
      c.moveTo(8, -6);
      c.lineTo(18, 6);
      c.moveTo(18, -6);
      c.lineTo(8, 6);
      c.stroke();
    }
    c.restore();

    // full screen button
    q = h.full;
    if (q) {
      var inFs = fsActive();
      circle(c, q.x, q.y, q.r - 2 * k);
      paint(c, COL.white, INK, 3.5 * k);
      c.save();
      c.translate(q.x, q.y);
      c.scale(k, k);
      c.strokeStyle = INK;
      c.lineWidth = 3.8;
      for (i = 0; i < 4; i++) {
        var sx = i === 0 || i === 3 ? -1 : 1, sy = i < 2 ? -1 : 1;
        c.beginPath();
        if (inFs) {
          c.moveTo(sx * 5, sy * 13);
          c.lineTo(sx * 5, sy * 5);
          c.lineTo(sx * 13, sy * 5);
        } else {
          c.moveTo(sx * 13, sy * 5);
          c.lineTo(sx * 13, sy * 13);
          c.lineTo(sx * 5, sy * 13);
        }
        c.stroke();
      }
      c.restore();
    }
  }

  function render() {
    var c = ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1;
    c.drawImage(back, 0, 0);

    useDesign(c);
    c.lineJoin = 'round';
    c.lineCap = 'round';
    c.save();
    c.beginPath();
    c.rect(GLASS.x, GLASS.y, GLASS.w, GLASS.h);
    c.clip();
    drawToys(c);
    drawGuide(c);
    drawClaw(c);
    c.restore();

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(front, view.fx, view.fy);

    useDesign(c);
    drawSign(c);
    drawButtons(c);
    drawTray(c);
    drawWin(c);

    useScreen(c);
    drawHud(c);
  }

  // ------------------------------------------------------------------
  // 13. Main loop
  // ------------------------------------------------------------------
  var lastTime = 0;
  var perf = { wait: 2, time: 0, frames: 0, slowRuns: 0, trial: false, before: 0, prev: 1, locked: false };

  // If the device cannot keep up, draw at a lower resolution.
  // A step down is only kept when it really makes the game smoother,
  // so a screen that simply refreshes slowly keeps its sharp picture.
  function watchSpeed(raw) {
    if (perf.locked || raw > 0.25) return;      // also skips pauses in a background tab
    if (perf.wait > 0) { perf.wait -= raw; return; }
    perf.time += raw;
    perf.frames++;
    if (perf.time < 1.5) return;
    var avg = perf.time / perf.frames;
    perf.time = 0;
    perf.frames = 0;
    if (perf.trial) {
      perf.trial = false;
      if (avg > perf.before * 0.85) {           // no real gain: go back and stop trying
        view.quality = perf.prev;
        perf.locked = true;
        needResize = true;
        return;
      }
    }
    perf.slowRuns = avg > 0.024 ? perf.slowRuns + 1 : 0;
    if (perf.slowRuns >= 2 && view.quality > 0.6) {
      perf.slowRuns = 0;
      perf.before = avg;
      perf.prev = view.quality;
      perf.trial = true;
      perf.wait = 0.6;
      view.quality *= 0.75;
      needResize = true;
    }
  }

  function frame(now) {
    window.requestAnimationFrame(frame);
    var raw = (now - lastTime) / 1000;
    lastTime = now;
    if (!(raw > 0)) return;
    watchSpeed(raw);
    if (canvas.clientWidth !== view.cw || canvas.clientHeight !== view.ch ||
        (window.devicePixelRatio || 1) !== view.dprSeen) needResize = true;
    if (needResize) {
      needResize = false;
      resize();
    }
    update(Math.min(raw, 0.05));
    render();
  }

  function boot() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d', { alpha: false });
    pickFont();
    bindInput();
    fillMachine();

    var started = false;
    function begin() {
      if (started) { needResize = true; return; }
      started = true;
      resize();
      needResize = false;
      render();
      canvas.style.visibility = 'visible';
      lastTime = window.performance && performance.now ? performance.now() : 0;
      window.requestAnimationFrame(frame);
    }
    // The toy pictures are stored as text at the bottom of the page, one block each.
    // The game starts when every picture has loaded, or failed to load.
    var waiting = TOY_ARTS.length, i;
    function loadArt(n) {
      var holder = document.getElementById(TOY_ARTS[n].id);
      var data = holder ? holder.textContent.replace(/\s+/g, '') : '';
      var img = new Image();
      function done(ok) {
        toyImgs[n] = ok ? img : null;
        if (--waiting === 0) begin();
      }
      img.onload = function () { done(true); };
      img.onerror = function () { done(false); };
      if (data) img.src = 'data:image/png;base64,' + data; else done(false);
    }
    for (i = 0; i < TOY_ARTS.length; i++) loadArt(i);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
