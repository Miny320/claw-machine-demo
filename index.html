<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFEFC8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Claw machine reward game. Move the claw, drop it, and grab a toy.">
<title>Claw Machine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%237C5CFF' stroke='%23151320' stroke-width='6'/%3E%3Cpath d='M20 25 L32 43 L44 25' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFEFC8;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    touch-action: none;
    visibility: hidden;   /* shown by the script after the first picture is drawn */
  }
  noscript p {
    font-family: sans-serif;
    padding: 24px;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" role="application" aria-label="Claw machine game. Use the left and right arrow keys to move the claw. Press the space bar to drop it and grab a toy.">Your browser cannot show this game.</canvas>
<noscript><p>This game needs JavaScript to run.</p></noscript>

<script>
/*
  Claw Machine demo
  -----------------
  One file, no libraries, no downloads. Everything is drawn on a canvas.
  The toy artwork is stored at the very bottom of this file.

  Controls
    Move:  left and right arrow keys, the two arrow buttons, or tap the glass
    Drop:  space bar, Enter, down arrow, or the DROP button
    Other: M turns the sound on and off, F toggles full screen
*/
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // 1. Settings. These are the numbers most worth tuning.
  // ------------------------------------------------------------------
  var SETTINGS = {
    moveSpeed: 340,     // claw speed while a move button is held (units per second)
    moveAccel: 1700,    // how quickly the claw speeds up
    moveBrake: 3200,    // how quickly the claw stops
    dropSpeed: 440,     // how fast the claw goes down
    liftSpeed: 300,     // how fast the claw comes back up
    carrySpeed: 430,    // how fast the claw carries a toy to the chute
    grabRange: 0.8,     // 1 = grabs when the claw is anywhere above a toy, lower = harder
    autoAlign: true,    // slide the claw over the middle of the toy while it drops
    sound: true,        // sound is on at the start (the player can mute it)
    title: 'PRIZE TIME!',
    startMessage: 'Move the claw, then press DROP!',
    missMessage: 'So close! Try again!',
    winSign: 'WINNER!',
    winMessages: ['You got it!', 'Great job!', 'Well done!', 'Awesome!'],
    againLabel: 'Play again'
  };

  // Where the round body of the toy sits inside its picture. cx and r are
  // fractions of the picture width, cy is a fraction of its height.
  // The game treats each toy as a circle.
  var TOY_ART = { cx: 0.4769, cy: 0.4802, r: 0.47257 };

  // Toys in the machine. r is the size, tilt is how the toy likes to sit.
  // The floor row fills the floor. Each top toy rests in a gap of the floor row.
  var FLOOR_ROW = [
    { r: 65, tilt: -0.16 },
    { r: 63, tilt: 0.12 },
    { r: 66, tilt: -0.07 },
    { r: 64, tilt: 0.2 }
  ];
  var TOP_ROW = [
    { gap: 0, r: 62, tilt: 0.1 },
    { gap: 2, r: 60, tilt: -0.2 }
  ];

  var MAX_DPR = 2;            // never draw sharper than this (keeps old devices fast)
  var MAX_PIXELS = 4200000;   // upper limit for the canvas size in real pixels

  // ------------------------------------------------------------------
  // 2. Colours
  // ------------------------------------------------------------------
  var INK = '#151320';
  var COL = {
    wall: '#FFEFC8', wallGlow: '#FFF6DE', wallDot: '#FFE2A0', skirting: '#FBDDA2',
    floor: '#F4C48A',
    body: '#7C5CFF', bodyDark: '#5A3DDB', bodyLight: '#A18BFF',
    glass: '#D9F2FF', glassBand: '#C9EBFC', glassMark: '#B4DDF4',
    inFloor: '#4A32B8', hole: '#241A55',
    sign: '#FFD23F', signDark: '#F4B81C',
    accent: '#FF5D73', accentDark: '#D93A56', accentLight: '#FFA3B0',
    metal: '#E3E8F0', metalDark: '#A9B3C6',
    dark: '#2F2750',
    go: '#3DDC97', goDark: '#1FB476',
    off: '#B9B0E8', offDark: '#8F83D1',
    white: '#FFFFFF'
  };
  var CONFETTI = ['#FF5D73', '#FFD23F', '#3DDC97', '#4DB8FF', '#7C5CFF', '#FFFFFF'];

  // ------------------------------------------------------------------
  // 3. Layout of the machine, in design units (the machine is 840 x 920)
  // ------------------------------------------------------------------
  var MW = 840, MH = 920;
  var CAB = { x: 20, y: 100, w: 800, h: 772, r: 30 };    // cabinet body
  var GLASS = { x: 50, y: 138, w: 740, h: 540 };         // window with the toys
  var FLOOR_Y = 666;                    // the toys rest on this line
  var CHUTE_L = 50, CHUTE_R = 240;      // prize chute, left part of the window
  var PART = { x: 240, y: 466, w: 9, h: 200 };           // clear wall beside the chute
  var PILE_L = 253, PILE_R = 770;       // side limits for the toys (room for a claw finger on the right)
  var RAIL_Y = 160;
  var PIVOT_Y = RAIL_Y + 18;            // the cable hangs from here
  var HUB_H = 32;                       // height of the claw body
  var HUB_HALF = 30;
  var L_MIN = 22;                       // shortest cable
  var HOME_X = 162;                     // the claw parks above the chute
  var X_MIN = HOME_X, X_MAX = 712;      // how far the claw can travel
  var PANEL_Y = 678;
  var DOOR = { x: 79, y: 724, w: 166, h: 132 };          // prize door
  var BTN = {
    left: { x: 352, y: 784, r: 60 },
    right: { x: 496, y: 784, r: 60 },
    drop: { x: 676, y: 784, r: 72 }
  };
  var SIGN = { x: 110, y: 6, w: 620, h: 120 };
  var PLATE = { x: 134, y: 40, w: 572, h: 54 };
  var SHOW = { x: 420, y: 432, r: 150 };                 // where the prize is shown after a win
  var AGAIN = { x: 420, y: 680, w: 372, h: 100 };        // "Play again" button
  var AGAIN_DELAY = 0.9;

  // One claw finger, described for the right side. The left one is mirrored.
  // Points are measured from the finger hinge.
  var PRONG = { px: 22, py: -9, c1x: 62, c1y: -3, c2x: 77, c2y: 88, tx: 34.7, ty: 120.3 };
  var DEG = Math.PI / 180;
  var GRIP_OPEN = 18 * DEG, GRIP_REST = 7 * DEG, GRIP_SHUT = -21 * DEG;
  var PRONG_W = 19;        // thickness of a finger, with its outline
  var CLOSE_TIME = 0.34;

  var G = 2600;            // gravity for the toys
  var SUB = 1 / 120;       // physics step

  // ------------------------------------------------------------------
  // 4. Small helpers
  // ------------------------------------------------------------------
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hyp(x, y) { return Math.sqrt(x * x + y * y); }
  function approach(v, goal, step) { return v < goal ? Math.min(v + step, goal) : Math.max(v - step, goal); }
  function wrap(a) {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  }
  function easeInOut(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
  function easeOut(u) { return 1 - Math.pow(1 - u, 3); }
  function backOut(u) { var s = 1.70158; u -= 1; return u * u * ((s + 1) * u + s) + 1; }
  function bounceOut(u) {
    var n = 7.5625, d = 2.75;
    if (u < 1 / d) return n * u * u;
    if (u < 2 / d) { u -= 1.5 / d; return n * u * u + 0.75; }
    if (u < 2.5 / d) { u -= 2.25 / d; return n * u * u + 0.9375; }
    u -= 2.625 / d;
    return n * u * u + 0.984375;
  }

  function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
  function oval(c, x, y, rx, ry) {
    c.beginPath();
    c.save();
    c.translate(x, y);
    c.scale(rx, ry);
    c.arc(0, 0, 1, 0, TAU);
    c.restore();
  }
  // Rounded rectangle. r is one number or [top left, top right, bottom right, bottom left].
  function rr(c, x, y, w, h, r) {
    var a = typeof r === 'number' ? [r, r, r, r] : r;
    c.beginPath();
    c.moveTo(x + a[0], y);
    c.lineTo(x + w - a[1], y);
    c.arcTo(x + w, y, x + w, y + a[1], a[1]);
    c.lineTo(x + w, y + h - a[2]);
    c.arcTo(x + w, y + h, x + w - a[2], y + h, a[2]);
    c.lineTo(x + a[3], y + h);
    c.arcTo(x, y + h, x, y + h - a[3], a[3]);
    c.lineTo(x, y + a[0]);
    c.arcTo(x, y, x + a[0], y, a[0]);
    c.closePath();
  }
  function poly(c, pts) {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
  }
  function paint(c, fill, stroke, width) {
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.stroke(); }
  }

  // Text. The game uses a rounded font when the device has one.
  var FONT = { weight: 'bold', stack: '"Trebuchet MS", "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif' };
  function pickFont() {
    var c = document.createElement('canvas').getContext('2d');
    var probe = 'Claw Machine 0123 mmwwii';
    function has(name) {
      c.font = '48px monospace';
      var mono = c.measureText(probe).width;
      c.font = '48px "' + name + '", monospace';
      var a = c.measureText(probe).width;
      c.font = '48px serif';
      var serif = c.measureText(probe).width;
      c.font = '48px "' + name + '", serif';
      var b = c.measureText(probe).width;
      return a !== mono || b !== serif;
    }
    var wanted = [
      { name: 'Arial Rounded MT Bold', weight: 'normal' },
      { name: 'Chalkboard SE', weight: 'bold' },
      { name: 'Comic Sans MS', weight: 'bold' }
    ];
    for (var i = 0; i < wanted.length; i++) {
      if (has(wanted[i].name)) {
        FONT.weight = wanted[i].weight;
        FONT.stack = '"' + wanted[i].name + '", ' + FONT.stack;
        return;
      }
    }
  }
  function font(px) { return FONT.weight + ' ' + px.toFixed(1) + 'px ' + FONT.stack; }
  // Centred text with an optional outline. Shrinks to fit maxW.
  function drawText(c, str, x, y, px, fill, stroke, width, maxW) {
    c.font = font(px);
    if (maxW) {
      var w = c.measureText(str).width;
      if (w > maxW) {
        var k = maxW / w;
        px *= k;
        if (width) width = Math.max(width * k, width * 0.7);
        c.font = font(px);
      }
    }
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = width; c.strokeText(str, x, y); }
    if (fill) { c.fillStyle = fill; c.fillText(str, x, y); }
  }

  // ------------------------------------------------------------------
  // 5. Canvas and screen layout
  // ------------------------------------------------------------------
  var canvas, ctx;
  var back = document.createElement('canvas');    // everything that never moves
  var front = document.createElement('canvas');   // glass shine, drawn over the toys
  var view = { w: 0, h: 0, cw: 0, ch: 0, dprSeen: 1, dpr: 1, s: 1, ox: 0, oy: 0, fx: 0, fy: 0, hud: null, quality: 1 };
  var needResize = true;
  var toyImg = null, toyReady = false, toySprite = null;

  // Full screen support differs between browsers.
  var fsRoot = document.documentElement;
  var fsEnter = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen || fsRoot.webkitRequestFullScreen;
  var fsLeave = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
  var fsOk = !!(fsEnter && fsLeave) && document.fullscreenEnabled !== false && document.webkitFullscreenEnabled !== false;
  function fsActive() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFullscreen() {
    if (!fsOk) return;
    try {
      if (fsActive()) {
        fsLeave.call(document);
      } else {
        var p = fsEnter.call(fsRoot);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (err) { /* full screen is optional */ }
  }

  function useDesign(c) {
    var k = view.dpr * view.s;
    c.setTransform(k, 0, 0, k, view.dpr * view.ox, view.dpr * view.oy);
  }
  function useScreen(c) { c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); }

  function resize() {
    view.cw = canvas.clientWidth;
    view.ch = canvas.clientHeight;
    view.dprSeen = window.devicePixelRatio || 1;
    var w = Math.max(160, view.cw || window.innerWidth);
    var h = Math.max(160, view.ch || window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    if (w * h * dpr * dpr > MAX_PIXELS) dpr = Math.sqrt(MAX_PIXELS / (w * h));
    dpr *= view.quality;      // lowered by watchSpeed() on slow devices
    view.w = w;
    view.h = h;
    view.dpr = dpr;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    // Corner buttons and the prize counter.
    var u = clamp(Math.min(w, h) * 0.085, 44, 120);
    var m = Math.round(u * 0.22);
    var padX = 12, padTop = 8, padBottom = 12;
    var s = Math.min((w - 2 * padX) / MW, (h - padTop - padBottom) / MH);
    // If the sign would sit under the corner buttons, keep the top strip free.
    var sideRoom = w / 2 - (SIGN.w / 2) * s;
    var hudWidth = Math.max(u * 2.35 + m, (fsOk ? 2 : 1) * (u + m)) + m;
    if (sideRoom < hudWidth) {
      padTop = m + u + 6;
      s = Math.min(s, (h - padTop - padBottom) / MH);
    }
    view.s = s;
    view.ox = (w - MW * s) / 2;
    view.oy = padTop + (h - padTop - padBottom - MH * s) * 0.68;
    view.hud = {
      u: u,
      m: m,
      sound: { x: w - m - u / 2, y: m + u / 2, r: u / 2 },
      full: fsOk ? { x: w - m - u * 1.5 - m * 0.7, y: m + u / 2, r: u / 2 } : null,
      count: { x: m, y: m, w: u * 2.35, h: u }
    };
    buildLayers();
  }

  // The parts that never change are drawn once and reused every frame.
  function buildLayers() {
    var d = view.dpr, s = view.s;
    back.width = canvas.width;
    back.height = canvas.height;
    var b = back.getContext('2d', { alpha: false });
    useScreen(b);
    drawRoom(b);
    useDesign(b);
    drawMachineBack(b);

    var m = 8;
    view.fx = Math.floor((view.ox + (GLASS.x - m) * s) * d);
    view.fy = Math.floor((view.oy + (GLASS.y - m) * s) * d);
    front.width = Math.ceil((GLASS.w + 2 * m) * s * d) + 2;
    front.height = Math.ceil((GLASS.h + 2 * m) * s * d) + 2;
    var f = front.getContext('2d');
    f.setTransform(d * s, 0, 0, d * s, d * view.ox - view.fx, d * view.oy - view.fy);
    drawMachineFront(f);

    buildToySprite();
  }

  // A copy of the toy picture at the size it is shown, so it stays crisp and cheap to draw.
  function buildToySprite() {
    toySprite = null;
    if (!toyReady) return;
    var sw = toyImg.naturalWidth, sh = toyImg.naturalHeight;
    var px = Math.ceil((70 / TOY_ART.r) * view.s * view.dpr);
    px = clamp(px, 24, sw);
    var src = toyImg, c, x;
    while (sw / 2 >= px) {
      c = document.createElement('canvas');
      c.width = Math.round(sw / 2);
      c.height = Math.round(sh / 2);
      x = c.getContext('2d');
      x.imageSmoothingEnabled = true;
      x.imageSmoothingQuality = 'high';
      x.drawImage(src, 0, 0, c.width, c.height);
      src = c;
      sw = c.width;
      sh = c.height;
    }
    c = document.createElement('canvas');
    c.width = px;
    c.height = Math.round(px * toyImg.naturalHeight / toyImg.naturalWidth);
    x = c.getContext('2d');
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(src, 0, 0, c.width, c.height);
    toySprite = c;
  }

  // ------------------------------------------------------------------
  // 6. Sound. Short beeps made in code, so there are no sound files.
  // ------------------------------------------------------------------
  var AudioCtor = window.AudioContext || window.webkitAudioContext;
  var snd = { ctx: null, out: null, on: SETTINGS.sound, hum: null, humOn: false };
  try {
    var savedSound = window.localStorage.getItem('clawMachineSound');
    if (savedSound === '0') snd.on = false;
    if (savedSound === '1') snd.on = true;
  } catch (err) { /* storage can be blocked, the default is fine */ }

  // Browsers only allow sound after the player touches something.
  function unlockAudio() {
    if (!AudioCtor) return;
    try {
      if (!snd.ctx) {
        snd.ctx = new AudioCtor();
        snd.out = snd.ctx.createGain();
        snd.out.gain.value = snd.on ? 0.6 : 0;
        snd.out.connect(snd.ctx.destination);
      }
      if (snd.ctx.state === 'suspended') {
        var wake = snd.ctx.resume();
        if (wake && wake.catch) wake.catch(function () {});
      }
    } catch (err) {
      snd.ctx = null;
      AudioCtor = null;
    }
  }
  function beep(freq, delay, dur, type, vol, slideTo) {
    var a = snd.ctx;
    if (!a || !snd.on || (a.state && a.state !== 'running')) return;
    try {
      var t0 = a.currentTime + delay;
      var osc = a.createOscillator();
      var gain = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(snd.out);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (err) { /* sound is optional */ }
  }
  // Soft motor hum while the claw travels.
  function setHum(on) {
    var a = snd.ctx;
    if (!a) return;
    try {
      if (!snd.hum) {
        if (!on) return;
        var g = a.createGain();
        g.gain.value = 0;
        g.connect(snd.out);
        var o1 = a.createOscillator(), o2 = a.createOscillator(), g2 = a.createGain();
        o1.type = 'triangle';
        o1.frequency.value = 174;
        o2.type = 'sine';
        o2.frequency.value = 261;
        g2.gain.value = 0.4;
        o1.connect(g);
        o2.connect(g2);
        g2.connect(g);
        o1.start();
        o2.start();
        snd.hum = g;
      }
      if (on !== snd.humOn) {
        snd.humOn = on;
        snd.hum.gain.setTargetAtTime(on ? 0.06 : 0, a.currentTime, 0.04);
      }
    } catch (err) { /* sound is optional */ }
  }
  var sfx = {
    click: function () { beep(660, 0, 0.06, 'triangle', 0.2); },
    drop: function (dur) { beep(720, 0, dur, 'sine', 0.13, 250); },
    grab: function () { beep(330, 0, 0.07, 'square', 0.08); beep(494, 0.08, 0.1, 'square', 0.08); },
    lift: function (dur) { beep(262, 0, dur, 'sine', 0.1, 523); },
    miss: function () { beep(392, 0, 0.16, 'triangle', 0.2); beep(294, 0.17, 0.3, 'triangle', 0.2); },
    fall: function () { beep(880, 0, 0.45, 'sine', 0.12, 220); },
    thud: function () { beep(150, 0, 0.14, 'sine', 0.4, 70); },
    pop: function () { beep(520, 0, 0.12, 'triangle', 0.2, 1040); },
    win: function () {
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < notes.length; i++) beep(notes[i], i * 0.11, 0.2, 'triangle', 0.22);
      beep(1318.5, 0.44, 0.6, 'triangle', 0.2);
      beep(1046.5, 0.44, 0.6, 'sine', 0.15);
      beep(783.99, 0.44, 0.6, 'sine', 0.12);
    }
  };
  function toggleSound() {
    snd.on = !snd.on;
    try {
      if (snd.out) snd.out.gain.setTargetAtTime(snd.on ? 0.6 : 0, snd.ctx.currentTime, 0.02);
    } catch (err) { /* sound is optional */ }
    try { window.localStorage.setItem('clawMachineSound', snd.on ? '1' : '0'); } catch (err2) { /* fine */ }
    if (snd.on) sfx.click();
  }

  // ------------------------------------------------------------------
  // 7. Game state
  // ------------------------------------------------------------------
  var balls = [];          // toys inside the machine
  var prize = null;        // the toy on its way out, after the claw lets go
  var confetti = [];
  var pile = { awake: true, calm: 0, acc: 0, fast: 0 };
  var claw = {
    x: HOME_X, v: 0,           // trolley position and speed
    L: L_MIN, Lv: 0,           // cable length and speed
    grip: GRIP_REST, gripFrom: 0, gripGoal: 0,   // how open the fingers are
    sway: 0, swayV: 0,         // small swing of the hanging claw
    goalX: null,               // where a tap on the glass asked the claw to go
    target: null,              // the toy the claw would grab right now
    held: null,                // the toy in the claw
    holdAngle: 0, holdDx: 0, holdDy: 0, holdL: 0
  };
  var game = {
    state: 'intro', t: 0, time: 0,
    won: 0, lastAct: -10, greeted: false,
    winMsg: '', dropFlash: -1, countPop: 0,
    squeezed: false, released: false, arrived: -1, thud: false
  };
  var sign = { text: SETTINGS.title, t: 1, until: 0 };

  function setState(s) {
    game.state = s;
    game.t = 0;
    if (s === 'ready' && !game.greeted) {
      game.greeted = true;
      setSign(SETTINGS.startMessage, 9);
    }
  }
  function setSign(text, seconds) {
    if (sign.text !== text) sign.t = 0;
    sign.text = text;
    sign.until = seconds ? game.time + seconds : 0;
  }
  function touchAct() { game.lastAct = game.time; }

  function makeToy(x, r, tilt) {
    return {
      x: x, y: 0, px: x, py: 0, vx: 0, vy: 0, pvy: 0, pv: 0, r: r,
      angle: tilt, spin: 0, tilt: tilt,
      sq: 0, sqV: 0,           // squash and stretch
      wig: 0,                  // "pick me" wiggle, 0 to 1
      held: false, onFloor: false, touch: false,
      lastX: 0, lastY: 0, depth: 0
    };
  }

  // Fill the machine. The toys drop in from above and settle.
  function fillMachine() {
    var list = [], x = PILE_L, i, f, a, b;
    var drops = [70, 210, 20, 150, 470, 600];
    for (i = 0; i < FLOOR_ROW.length; i++) {
      f = FLOOR_ROW[i];
      x += f.r;
      list.push(makeToy(x, f.r, f.tilt));
      x += f.r;
    }
    for (i = 0; i < TOP_ROW.length; i++) {
      f = TOP_ROW[i];
      a = list[f.gap];
      list.push(makeToy(a.x + a.r, f.r, f.tilt));
    }
    balls.length = 0;
    for (i = 0; i < list.length; i++) {
      b = list[i];
      b.y = GLASS.y - b.r - drops[i % drops.length];
      b.py = b.y;
      b.angle = b.tilt + (i % 2 ? 0.6 : -0.6);
      balls.push(b);
    }
    pile.awake = true;
    pile.calm = 0;
    pile.fast = 1e9;
  }
  function wakePile() { pile.awake = true; pile.calm = 0; }

  // ------------------------------------------------------------------
  // 8. Claw geometry
  // ------------------------------------------------------------------
  // Finger tip position for a given opening angle, measured from the palm.
  function tipAt(a) {
    var cs = Math.cos(a), sn = Math.sin(a);
    return { x: PRONG.px + PRONG.tx * cs + PRONG.ty * sn, y: PRONG.py - PRONG.tx * sn + PRONG.ty * cs };
  }
  // Opening angle at which the finger tips touch a toy of radius r.
  function gripFor(r) {
    var lo = GRIP_SHUT, hi = GRIP_OPEN, mid, t;
    for (var i = 0; i < 18; i++) {
      mid = (lo + hi) / 2;
      t = tipAt(mid);
      if (hyp(t.x, t.y - (r + 2)) < r + 7) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  var TIP_PAD = 10;
  // Widest point of one finger for an opening angle, measured sideways from the palm.
  function reachAt(a) {
    var cs = Math.cos(a), sn = Math.sin(a), best = 0;
    for (var i = 5; i <= 10; i++) {
      var t = i / 10, u = 1 - t;
      var x = 3 * u * u * t * PRONG.c1x + 3 * u * t * t * PRONG.c2x + t * t * t * PRONG.tx;
      var y = 3 * u * u * t * PRONG.c1y + 3 * u * t * t * PRONG.c2y + t * t * t * PRONG.ty;
      best = Math.max(best, PRONG.px + x * cs + y * sn);
    }
    return best + PRONG_W / 2;
  }
  // How far the fingers open on the way down at x: wide, but not through
  // the right wall. They always open enough to pass a toy of radius r.
  function openFor(r, x) {
    var room = GLASS.x + GLASS.w + 8 - x;
    if (reachAt(GRIP_OPEN) <= room) return GRIP_OPEN;
    var lo = GRIP_SHUT, hi = GRIP_OPEN, mid, i;
    for (i = 0; i < 14; i++) {
      mid = (lo + hi) / 2;
      if (tipAt(mid).x < r + TIP_PAD + 5) lo = mid; else hi = mid;
    }
    var least = hi;
    lo = GRIP_SHUT;
    hi = GRIP_OPEN;
    for (i = 0; i < 14; i++) {
      mid = (lo + hi) / 2;
      if (reachAt(mid) <= room) lo = mid; else hi = mid;
    }
    return Math.max(least, lo);
  }

  function palmPos() {
    var d = claw.L + HUB_H;
    return { x: claw.x - Math.sin(claw.sway) * d, y: PIVOT_Y + Math.cos(claw.sway) * d };
  }
  function holdPos(r) {
    var d = claw.L + HUB_H + r + 2;
    return { x: claw.x - Math.sin(claw.sway) * d, y: PIVOT_Y + Math.cos(claw.sway) * d };
  }

  // True when another toy sits right on top of this one, so the claw cannot reach it.
  function isCovered(b) {
    for (var i = 0; i < balls.length; i++) {
      var o = balls[i];
      if (o === b || o.held) continue;
      if (o.y < b.y - b.r * 0.3 && Math.abs(o.x - b.x) < o.r * 0.6) return true;
    }
    return false;
  }
  // The toy the claw would grab if it dropped at x, or null.
  // It is the toy most directly below the claw. Higher toys win a close call.
  function findTarget(x) {
    var best = null, bestScore = 1e9;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.held) continue;
      var d = Math.abs(x - b.x);
      if (d > b.r * SETTINGS.grabRange || isCovered(b)) continue;
      var score = d + b.y * 0.15;
      if (score < bestScore) { best = b; bestScore = score; }
    }
    return best;
  }
  // How low the palm can go at x when there is nothing to grab.
  // The claw stops when its body or a finger tip touches a toy or the floor.
  function emptyStopY(x) {
    var tip = tipAt(openFor(0, x));
    var tipDrop = tip.y + TIP_PAD;
    var probes = [[0, 0, HUB_HALF], [tip.x, tipDrop, 6], [-tip.x, tipDrop, 6]];
    var y = FLOOR_Y - tipDrop - 5;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.held) continue;
      for (var k = 0; k < probes.length; k++) {
        var p = probes[k];
        var dx = Math.abs(x + p[0] - b.x) - p[2];
        if (dx < b.r) {
          var d = Math.max(dx, 0);
          y = Math.min(y, b.y - Math.sqrt(b.r * b.r - d * d) - p[1] - 2);
        }
      }
    }
    return Math.max(y, PIVOT_Y + L_MIN + HUB_H + 12);
  }
  // Height of the first thing below the middle of the claw (for the aiming dots).
  function surfaceBelow(x) {
    var y = x < CHUTE_R ? FLOOR_Y + 12 : FLOOR_Y;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i], dx = Math.abs(x - b.x);
      if (!b.held && dx < b.r) y = Math.min(y, b.y - Math.sqrt(b.r * b.r - dx * dx));
    }
    return y;
  }

  // ------------------------------------------------------------------
  // 9. Input
  // ------------------------------------------------------------------
  var keys = { left: false, right: false };
  var input = { left: false, right: false };
  var pointers = {};                       // pointer id -> what it is pressing
  var tapUntil = { left: 0, right: 0 };    // a quick tap still moves the claw a little

  function holding(role) {
    for (var id in pointers) if (pointers[id] === role) return true;
    return false;
  }
  function canSteer() { return game.state === 'ready' || game.state === 'intro'; }

  // What is under a point of the page?
  function roleAt(cx, cy) {
    var rect = canvas.getBoundingClientRect();
    var x = cx - rect.left, y = cy - rect.top;
    var h = view.hud;
    if (hyp(x - h.sound.x, y - h.sound.y) <= h.sound.r + 6) return 'sound';
    if (h.full && hyp(x - h.full.x, y - h.full.y) <= h.full.r + 6) return 'full';
    var dx = (x - view.ox) / view.s, dy = (y - view.oy) / view.s;
    if (game.state === 'win') {
      var over = Math.abs(dx - AGAIN.x) <= AGAIN.w / 2 + 14 && Math.abs(dy - AGAIN.y) <= AGAIN.h / 2 + 14;
      return over && game.t > AGAIN_DELAY ? 'again' : null;
    }
    if (game.state === 'winOut') return null;
    if (hyp(dx - BTN.left.x, dy - BTN.left.y + 5) <= BTN.left.r + 10) return 'left';
    if (hyp(dx - BTN.right.x, dy - BTN.right.y + 5) <= BTN.right.r + 10) return 'right';
    if (hyp(dx - BTN.drop.x, dy - BTN.drop.y + 5) <= BTN.drop.r + 10) return 'drop';
    if (dx >= GLASS.x && dx <= GLASS.x + GLASS.w && dy >= GLASS.y && dy <= GLASS.y + GLASS.h) return 'glass';
    return null;
  }
  function aimAt(cx) {
    if (!canSteer()) return;
    var rect = canvas.getBoundingClientRect();
    claw.goalX = clamp((cx - rect.left - view.ox) / view.s, X_MIN, X_MAX);
    touchAct();
  }
  function pressMove(role) {
    if (!canSteer()) return;
    tapUntil[role] = game.time + 0.16;
    claw.goalX = null;
    touchAct();
    sfx.click();
  }
  function pointerDown(id, cx, cy) {
    unlockAudio();
    var role = roleAt(cx, cy);
    pointers[id] = role;
    if (role === 'left' || role === 'right') pressMove(role);
    else if (role === 'drop') { game.dropFlash = game.time; tryDrop(); }
    else if (role === 'again') playAgain();
    else if (role === 'glass') aimAt(cx);
  }
  function pointerMove(id, cx, cy, isMouse) {
    if (pointers[id] === 'glass') aimAt(cx);
    if (isMouse) {
      var role = roleAt(cx, cy);
      var live = role === 'sound' || role === 'full' || role === 'again' ||
        (role && game.state === 'ready') || ((role === 'left' || role === 'right' || role === 'glass') && canSteer());
      canvas.style.cursor = live ? 'pointer' : 'default';
    }
  }
  function pointerUp(id, cx, cy) {
    var role = pointers[id];
    delete pointers[id];
    unlockAudio();
    if (role === 'sound' && roleAt(cx, cy) === 'sound') toggleSound();
    if (role === 'full' && roleAt(cx, cy) === 'full') toggleFullscreen();
  }
  function releaseAll() {
    keys.left = false;
    keys.right = false;
    pointers = {};
  }

  function keyRole(e) {
    var k = e.key, n = e.keyCode;
    if (k === 'ArrowLeft' || k === 'Left' || n === 37 || k === 'a' || k === 'A') return 'left';
    if (k === 'ArrowRight' || k === 'Right' || n === 39 || k === 'd' || k === 'D') return 'right';
    if (k === ' ' || k === 'Spacebar' || n === 32 || k === 'Enter' || n === 13 ||
        k === 'ArrowDown' || k === 'Down' || n === 40) return 'go';
    if (k === 'm' || k === 'M') return 'sound';
    if (k === 'f' || k === 'F') return 'full';
    return null;
  }
  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var role = keyRole(e);
    if (!role) return;
    e.preventDefault();
    unlockAudio();
    if (role === 'left' || role === 'right') {
      if (!keys[role]) pressMove(role);
      keys[role] = true;
    } else if (!e.repeat) {
      if (role === 'sound') toggleSound();
      else if (role === 'full') toggleFullscreen();
      else if (game.state === 'win') playAgain();
      else { game.dropFlash = game.time; tryDrop(); }
    }
  }
  function onKeyUp(e) {
    var role = keyRole(e);
    if (role === 'left' || role === 'right') keys[role] = false;
  }

  function bindInput() {
    function stop(e) { e.preventDefault(); }
    if (window.PointerEvent) {
      canvas.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not needed */ }
        try { canvas.focus(); } catch (err2) { /* not needed */ }
        pointerDown(e.pointerId, e.clientX, e.clientY);
      });
      canvas.addEventListener('pointermove', function (e) {
        pointerMove(e.pointerId, e.clientX, e.clientY, e.pointerType === 'mouse');
      });
      canvas.addEventListener('pointerup', function (e) { pointerUp(e.pointerId, e.clientX, e.clientY); });
      canvas.addEventListener('pointercancel', function (e) { pointerUp(e.pointerId, -9999, -9999); });
    } else {
      // Older browsers: touch and mouse events.
      var eachTouch = function (e, fn) {
        e.preventDefault();
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          fn('t' + t.identifier, t.clientX, t.clientY);
        }
      };
      canvas.addEventListener('touchstart', function (e) { eachTouch(e, pointerDown); }, { passive: false });
      canvas.addEventListener('touchmove', function (e) { eachTouch(e, function (id, x, y) { pointerMove(id, x, y, false); }); }, { passive: false });
      canvas.addEventListener('touchend', function (e) { eachTouch(e, pointerUp); }, { passive: false });
      canvas.addEventListener('touchcancel', function (e) { eachTouch(e, function (id) { pointerUp(id, -9999, -9999); }); }, { passive: false });
      canvas.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        e.preventDefault();
        pointerDown('mouse', e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', function (e) { pointerMove('mouse', e.clientX, e.clientY, true); });
      window.addEventListener('mouseup', function (e) { pointerUp('mouse', e.clientX, e.clientY); });
    }
    canvas.addEventListener('contextmenu', stop);
    document.addEventListener('gesturestart', stop);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { releaseAll(); setHum(false); }
    });
    var ask = function () { needResize = true; };
    window.addEventListener('resize', ask);
    window.addEventListener('orientationchange', ask);
    document.addEventListener('fullscreenchange', ask);
    document.addEventListener('webkitfullscreenchange', ask);
  }

  // ------------------------------------------------------------------
  // 10. Game logic
  // ------------------------------------------------------------------
  // Move the trolley toward a wanted speed, with smooth starts and stops.
  function driveTrolley(want, dt) {
    var slowing = Math.abs(want) < Math.abs(claw.v) || want * claw.v < 0;
    var step = (slowing ? SETTINGS.moveBrake : SETTINGS.moveAccel) * dt;
    claw.v += clamp(want - claw.v, -step, step);
    claw.x += claw.v * dt;
    if (claw.x < X_MIN) { claw.x = X_MIN; if (claw.v < 0) claw.v = 0; }
    if (claw.x > X_MAX) { claw.x = X_MAX; if (claw.v > 0) claw.v = 0; }
  }
  function driveTo(x, speed, dt) {
    driveTrolley(clamp((x - claw.x) * 7, -speed, speed), dt);
  }
  function steer(dt) {
    var dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (dir !== 0) {
      claw.goalX = null;
      driveTrolley(dir * SETTINGS.moveSpeed, dt);
    } else if (claw.goalX !== null) {
      driveTo(claw.goalX, SETTINGS.moveSpeed, dt);
      if (Math.abs(claw.goalX - claw.x) < 0.6 && Math.abs(claw.v) < 8) claw.goalX = null;
    } else {
      driveTrolley(0, dt);
    }
  }

  function tryDrop() {
    if (game.state !== 'ready') return;
    touchAct();
    claw.goalX = null;
    claw.target = findTarget(claw.x);
    claw.Lv = 0;
    setState('dropping');
    if (sign.text === SETTINGS.startMessage) setSign(SETTINGS.title);
    var stop = claw.target ? claw.target.y - claw.target.r - 2 : emptyStopY(claw.x);
    sfx.click();
    sfx.drop(clamp((stop - palmPos().y) / SETTINGS.dropSpeed + 0.2, 0.3, 1.4));
  }

  function updateDrop(dt) {
    var t = claw.target, stop;
    var open = t ? openFor(t.r, clamp(t.x, X_MIN, X_MAX)) : openFor(0, claw.x);
    claw.grip = approach(claw.grip, open, 2.2 * dt);
    if (t) {
      if (SETTINGS.autoAlign) driveTo(clamp(t.x, X_MIN, X_MAX), SETTINGS.moveSpeed, dt);
      else driveTrolley(0, dt);
      stop = t.y - t.r - 2;
    } else {
      driveTrolley(0, dt);
      stop = emptyStopY(claw.x);
    }
    var stopL = stop - PIVOT_Y - HUB_H;
    var left = stopL - claw.L;
    var top = Math.min(SETTINGS.dropSpeed, Math.sqrt(2 * 2600 * Math.max(left, 0)) + 40);
    claw.Lv = Math.min(claw.Lv + 2200 * dt, top);
    claw.L += claw.Lv * dt;
    if (claw.L >= stopL) {
      claw.L = Math.max(stopL, L_MIN);
      claw.Lv = 0;
      startClose();
    }
  }

  function startClose() {
    var t = claw.target, p = palmPos();
    setState('closing');
    game.squeezed = false;
    claw.gripFrom = claw.grip;
    if (t && !t.held && Math.abs(p.x - t.x) < t.r && Math.abs(t.y - t.r - 2 - p.y) < 30) {
      claw.held = t;
      t.held = true;
      t.lastX = t.x;
      t.lastY = t.y;
      t.depth = depthOf(t);
      // The toy stays where it is while the fingers close. Any small offset
      // from the middle of the claw is eased away later, on the way up.
      claw.holdDx = t.x - p.x;
      claw.holdDy = t.y - (p.y + t.r + 2);
      claw.holdL = claw.L;
      claw.holdAngle = t.angle - claw.sway;
      claw.gripGoal = gripFor(t.r);
      wakePile();
    } else {
      claw.target = null;
      claw.gripGoal = GRIP_SHUT;
    }
    sfx.grab();
  }

  function updateClose(dt) {
    driveTrolley(0, dt);
    var u = clamp(game.t / CLOSE_TIME, 0, 1);
    claw.grip = lerp(claw.gripFrom, claw.gripGoal, easeInOut(u));
    if (claw.held && !game.squeezed && u > 0.7) {
      game.squeezed = true;
      claw.held.sqV -= 7;      // a little squeeze as the fingers close
    }
    if (game.t > CLOSE_TIME + 0.16) {
      setState('lifting');
      claw.Lv = 0;
      sfx.lift(clamp((claw.L - L_MIN) / SETTINGS.liftSpeed + 0.25, 0.3, 1.5));
    }
  }

  function updateLift(dt) {
    driveTrolley(0, dt);
    var left = claw.L - L_MIN;
    var top = Math.min(SETTINGS.liftSpeed, Math.sqrt(2 * 1800 * Math.max(left, 0)) + 30);
    claw.Lv = Math.min(claw.Lv + 1000 * dt, top);
    claw.L -= claw.Lv * dt;
    if (claw.held) wakePile();
    if (claw.L <= L_MIN) {
      claw.L = L_MIN;
      claw.Lv = 0;
      if (claw.held) {
        game.arrived = -1;
        setState('carrying');
      } else {
        setSign(SETTINGS.missMessage, 2.6);
        sfx.miss();
        touchAct();
        setState('ready');
      }
    }
  }

  function updateCarry(dt) {
    driveTo(HOME_X, SETTINGS.carrySpeed, dt);
    if (game.arrived < 0 && Math.abs(HOME_X - claw.x) < 0.8 && Math.abs(claw.v) < 8) {
      claw.x = HOME_X;
      claw.v = 0;
      game.arrived = game.t;
    }
    if (game.arrived >= 0 && game.t - game.arrived > 0.35) {
      game.released = false;
      claw.gripFrom = claw.grip;
      setState('releasing');
    }
  }

  function updateRelease(dt) {
    driveTrolley(0, dt);
    var u = clamp(game.t / 0.24, 0, 1);
    claw.grip = lerp(claw.gripFrom, GRIP_OPEN, easeOut(u));
    if (!game.released && u >= 0.45) {
      game.released = true;
      var b = claw.held;
      claw.held = null;
      claw.target = null;
      balls.splice(balls.indexOf(b), 1);
      b.held = false;
      prize = b;
      prize.phase = 'fall';
      prize.vy = 0;
      prize.spin = 0.9;
      sfx.fall();
    }
    if (game.released && prize && prize.y - prize.r > GLASS.y + GLASS.h + 8) {
      prize.phase = 'tray';
      prize.trayR = Math.min(prize.r, 60);
      prize.trayY = DOOR.y - prize.trayR - 4;
      prize.trayFrom = wrap(prize.angle);
      game.thud = false;
      setState('tray');
    }
  }

  // The prize lands behind the prize door.
  function updateTray(dt) {
    claw.grip = approach(claw.grip, GRIP_REST, 1.6 * dt);
    driveTrolley(0, dt);
    var u = clamp((game.t - 0.2) / 0.6, 0, 1);
    var restY = DOOR.y + DOOR.h - prize.trayR - 12;
    prize.trayY = lerp(DOOR.y - prize.trayR - 4, restY, bounceOut(u));
    prize.angle = lerp(prize.trayFrom, -0.14, easeOut(u));
    if (!game.thud && u > 0.36) {
      game.thud = true;
      prize.sqV += 9;
      sfx.thud();
    }
    if (game.t > 1.25) startWin();
  }

  function startWin() {
    var list = SETTINGS.winMessages;
    game.winMsg = list[Math.floor(Math.random() * list.length)];
    prize.phase = 'show';
    prize.showFrom = wrap(prize.angle);
    setState('win');
    setSign(SETTINGS.winSign);
    sfx.win();
    burst(70);
  }
  function playAgain() {
    if (game.state !== 'win' || game.t < AGAIN_DELAY) return;
    touchAct();
    sfx.pop();
    setState('winOut');
  }
  function finishRound() {
    game.won++;
    game.countPop = 1;
    prize = null;
    setSign(SETTINGS.title);
    if (balls.length === 0) {
      fillMachine();
      setState('intro');
    } else {
      setState('ready');
    }
  }

  // The hanging claw swings a little when the trolley speeds up or stops.
  function updateSway(dt, acc) {
    var len = claw.L + 80;
    var stiff = 2600 / len;
    var damp = (game.state === 'dropping' || game.state === 'closing') ? 11 : 3.2;
    var idle = canSteer() ? 0.016 * Math.sin(game.time * 1.9) : 0;
    acc = clamp(acc, -6000, 6000);
    claw.swayV += (-stiff * (claw.sway - idle) - damp * claw.swayV + acc * 0.2 / len) * dt;
    claw.sway = clamp(claw.sway + claw.swayV * dt, -0.3, 0.3);
  }

  // Keep the grabbed toy inside the claw.
  function placeHeld() {
    var b = claw.held;
    if (!b) return;
    var p = holdPos(b.r);
    var k = 0;      // 1 = just grabbed, 0 = sitting in the middle of the claw
    if (game.state === 'closing') k = 1;
    else if (game.state === 'lifting') k = 1 - easeInOut(clamp((claw.holdL - claw.L) / 90, 0, 1));
    b.x = p.x + claw.holdDx * k;
    b.y = p.y + claw.holdDy * k;
    b.angle = claw.holdAngle + claw.sway;
    b.vx = 0;
    b.vy = 0;
    b.spin = 0;
  }

  // One small physics step for the pile of toys. The toys are circles.
  function stepPile(dt) {
    var n = balls.length, i, j, it, b, o;
    var drag = Math.exp(-0.5 * dt), rub = Math.exp(-5 * dt);
    for (i = 0; i < n; i++) {
      b = balls[i];
      b.onFloor = false;
      b.touch = false;
      if (b.held) continue;
      b.vy += G * dt;
      b.vx *= drag;
      b.vy *= drag;
      b.pvy = b.vy;
      b.pv = hyp(b.vx, b.vy);
      b.px = b.x;
      b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
    for (it = 0; it < 8; it++) {
      // toys push each other apart
      for (i = 0; i < n; i++) {
        b = balls[i];
        for (j = i + 1; j < n; j++) {
          o = balls[j];
          if (b.held && o.held) continue;
          var dx = o.x - b.x, dy = o.y - b.y, reach = b.r + o.r;
          var d2 = dx * dx + dy * dy;
          if (d2 >= reach * reach) continue;
          var d = Math.sqrt(d2), nx = 0, ny = -1;
          if (d > 0.0001) { nx = dx / d; ny = dy / d; }
          var pen = reach - d;
          var wb = b.held ? 0 : (o.held ? 1 : 0.5);
          var wo = o.held ? 0 : (b.held ? 1 : 0.5);
          b.x -= nx * pen * wb;
          b.y -= ny * pen * wb;
          o.x += nx * pen * wo;
          o.y += ny * pen * wo;
          b.touch = true;
          o.touch = true;
        }
      }
      // walls and floor
      for (i = 0; i < n; i++) {
        b = balls[i];
        if (b.held) continue;
        if (b.x < PILE_L + b.r) b.x = PILE_L + b.r;
        if (b.x > PILE_R - b.r) b.x = PILE_R - b.r;
        if (b.y > FLOOR_Y - b.r) { b.y = FLOOR_Y - b.r; b.onFloor = true; }
      }
    }
    var moving = false, fast = 0;
    for (i = 0; i < n; i++) {
      b = balls[i];
      if (b.held) continue;
      var vx = (b.x - b.px) / dt, vy = (b.y - b.py) / dt;
      if (b.onFloor && b.pvy > 260) {
        vy = -b.pvy * 0.28;                         // small bounce
        b.sqV += Math.min(b.pvy / 60, 14);          // and a squash
      }
      if (b.onFloor || b.touch) vx *= rub;
      // A push may speed a toy up only a little, so nothing ever shoots away.
      var sp = hyp(vx, vy);
      if (sp > b.pv + 420) {
        vx *= (b.pv + 420) / sp;
        vy *= (b.pv + 420) / sp;
      }
      b.vx = vx;
      b.vy = vy;
      // Rolling toys turn. Resting toys wobble back to their favourite tilt.
      var lean = wrap(b.tilt - b.angle);
      if (Math.abs(vx) + Math.abs(vy) > 40) {
        if (b.onFloor || b.touch) b.spin += (vx / b.r - b.spin) * Math.min(1, 10 * dt);
      } else {
        b.spin += (lean * 34 - b.spin * 5.5) * dt;
      }
      b.angle += b.spin * dt;
      fast = Math.max(fast, vx * vx + vy * vy);
      if (vx * vx + vy * vy > 16 || Math.abs(b.spin) > 0.06 || Math.abs(lean) > 0.015) moving = true;
    }
    pile.fast = fast;
    if (moving) {
      pile.calm = 0;
    } else {
      pile.calm += dt;
      if (pile.calm > 0.35) pile.awake = false;     // nothing moves: stop computing
    }
  }

  function updatePile(dt) {
    var i, b, h = claw.held;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      b.sqV += (-260 * b.sq - 15 * b.sqV) * dt;
      b.sq = clamp(b.sq + b.sqV * dt, -1, 1);
      b.wig = approach(b.wig, (b === claw.target && game.state === 'ready') ? 1 : 0, 6 * dt);
    }
    if (!pile.awake) {
      if (h) { h.lastX = h.x; h.lastY = h.y; }
      return;
    }
    pile.acc += dt;
    var n = Math.min(8, Math.floor(pile.acc / SUB));
    pile.acc -= n * SUB;
    if (pile.acc > SUB) pile.acc = 0;
    if (n === 0) return;
    // The grabbed toy moves with the claw. Spread its move over the small steps.
    var hx = 0, hy = 0;
    if (h) { hx = h.x; hy = h.y; }
    for (i = 1; i <= n; i++) {
      if (h) { h.x = lerp(h.lastX, hx, i / n); h.y = lerp(h.lastY, hy, i / n); }
      stepPile(SUB);
    }
    if (h) { h.x = hx; h.y = hy; h.lastX = hx; h.lastY = hy; }
  }

  function updatePrize(dt) {
    var p = prize;
    if (!p) return;
    p.sqV += (-260 * p.sq - 15 * p.sqV) * dt;
    p.sq = clamp(p.sq + p.sqV * dt, -1, 1);
    if (p.phase !== 'fall') return;
    p.vy += G * dt;
    p.y += p.vy * dt;
    p.angle += p.spin * dt;
    p.x = clamp(p.x, CHUTE_L + p.r + 2, CHUTE_R - p.r - 2);
  }

  // Confetti lives in design units so it scales with the machine.
  function addConfetti(x, y, vx, vy) {
    confetti.push({
      x: x, y: y, vx: vx, vy: vy,
      w: 12 + Math.random() * 12, h: 7 + Math.random() * 7,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 9,
      flip: Math.random() * TAU, vf: 5 + Math.random() * 7,
      col: CONFETTI[Math.floor(Math.random() * CONFETTI.length)]
    });
  }
  function burst(count) {
    for (var i = 0; i < count; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
      var sp = 380 + Math.random() * 620;
      addConfetti(SHOW.x, SHOW.y, Math.cos(a) * sp, Math.sin(a) * sp);
    }
  }
  function updateConfetti(dt) {
    var bottom = (view.h - view.oy) / view.s + 30, i, p;
    if (game.state === 'win' && confetti.length < 90 && Math.random() < dt * 14) {
      var x0 = -view.ox / view.s, x1 = (view.w - view.ox) / view.s;
      addConfetti(lerp(x0, x1, Math.random()), -view.oy / view.s - 20, (Math.random() - 0.5) * 60, 120 + Math.random() * 120);
    }
    for (i = confetti.length - 1; i >= 0; i--) {
      p = confetti[i];
      p.vy += 620 * dt;
      p.vx *= Math.exp(-1.6 * dt);
      p.vy = Math.min(p.vy * Math.exp(-0.9 * dt), 430);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.flip += p.vf * dt;
      if (p.y > bottom) confetti.splice(i, 1);
    }
  }

  function update(dt) {
    var v0 = claw.v;
    game.time += dt;
    game.t += dt;
    input.left = keys.left || holding('left') || game.time < tapUntil.left;
    input.right = keys.right || holding('right') || game.time < tapUntil.right;

    switch (game.state) {
      case 'intro':
        steer(dt);
        claw.target = null;
        if (!pile.awake || (game.t > 1 && pile.fast < 900) || game.t > 3) setState('ready');
        break;
      case 'ready':
        steer(dt);
        claw.grip = approach(claw.grip, GRIP_REST, 1.6 * dt);
        claw.target = findTarget(claw.x);
        break;
      case 'dropping': updateDrop(dt); break;
      case 'closing': updateClose(dt); break;
      case 'lifting': updateLift(dt); break;
      case 'carrying': updateCarry(dt); break;
      case 'releasing': updateRelease(dt); break;
      case 'tray': updateTray(dt); break;
      case 'win':
      case 'winOut':
        claw.grip = approach(claw.grip, GRIP_REST, 1.6 * dt);
        driveTrolley(0, dt);
        if (game.state === 'winOut' && game.t >= 0.45) finishRound();
        break;
    }

    updateSway(dt, (claw.v - v0) / dt);
    placeHeld();
    updatePile(dt);
    updatePrize(dt);
    updateConfetti(dt);

    sign.t += dt;
    if (sign.until && game.time > sign.until) setSign(SETTINGS.title);
    game.countPop = Math.max(0, game.countPop - dt * 2.5);

    var s = game.state;
    setHum(Math.abs(claw.v) > 14 && (s === 'ready' || s === 'intro' || s === 'carrying') && !document.hidden);
  }

  // ------------------------------------------------------------------
  // 11. Drawing: the parts that never move
  // ------------------------------------------------------------------
  function drawRoom(c) {
    var w = view.w, h = view.h, s = view.s;
    var floorTop = view.oy + 886 * s;
    c.fillStyle = COL.wall;
    c.fillRect(0, 0, w, h);
    // soft light on the wall behind the machine
    circle(c, view.ox + 420 * s, view.oy + 470 * s, 640 * s);
    c.fillStyle = COL.wallGlow;
    c.fill();
    // dotted wallpaper
    var step = 104 * s, rad = 9 * s, row = 0, x, y;
    c.fillStyle = COL.wallDot;
    for (y = (view.oy % (step / 2)) - step; y < floorTop; y += step / 2, row++) {
      for (x = (view.ox % step) - step + (row % 2 ? step / 2 : 0); x < w + step; x += step) {
        circle(c, x, y, rad);
        c.fill();
      }
    }
    // skirting board and floor
    c.fillStyle = COL.skirting;
    c.fillRect(0, floorTop - 30 * s, w, 30 * s);
    c.fillStyle = INK;
    c.fillRect(0, floorTop - 32 * s, w, 4 * s);
    c.fillStyle = COL.floor;
    c.fillRect(0, floorTop, w, Math.max(0, h - floorTop));
    c.fillStyle = INK;
    c.fillRect(0, floorTop - 2.5 * s, w, 5 * s);
  }

  function drawMachineFront(c) {

  // ------------------------------------------------------------------
  // 12. Drawing: the parts that move
  // ------------------------------------------------------------------
  // Draw one toy. (x, y) is the middle of its round body, r its size.
  // sq squashes it a little, keeping its bottom in place.
  function drawToy(c, x, y, r, angle, sq, sharp) {
    var sy = 1 - 0.09 * sq, sx = 1 + 0.09 * sq;
    c.save();
    c.translate(x, y + r * (1 - sy));
    c.scale(sx, sy);
    c.rotate(angle);
    if (toyReady) {
      var src = (sharp || !toySprite) ? toyImg : toySprite;
      var w = r / TOY_ART.r;
      var h = w * toyImg.naturalHeight / toyImg.naturalWidth;
      c.drawImage(src, -TOY_ART.cx * w, -TOY_ART.cy * h, w, h);
    } else {
      // plain ball, only used if the picture could not be loaded
      circle(c, 0, 0, r - 2);
      paint(c, '#FAFBFD', INK, 4);
      circle(c, -r * 0.2, r * 0.15, r * 0.08);
      paint(c, INK, null, 0);
      circle(c, r * 0.25, r * 0.15, r * 0.08);
      paint(c, INK, null, 0);
      c.beginPath();
      c.arc(r * 0.02, r * 0.26, r * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
      paint(c, null, INK, 4);
    }
    c.restore();
  }

  // Toys lower in the pile are drawn first. A toy in the claw keeps the
  // place it had when it was grabbed.
  function depthOf(b) { return Math.round((b.y + b.r) / 14); }
  function byDepth(a, b) {
    var la = a.held ? a.depth : depthOf(a), lb = b.held ? b.depth : depthOf(b);
    if (la !== lb) return lb - la;
    return b.x - a.x;
  }
  function drawToys(c) {
    var list = balls.slice().sort(byDepth);
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var wave = b.wig > 0 ? Math.sin(game.time * 11) * b.wig : 0;
      drawToy(c, b.x, b.y, b.r * (1 + 0.025 * b.wig), b.angle + wave * 0.075, b.sq, false);
    }
    if (prize && prize.phase === 'fall') drawToy(c, prize.x, prize.y, prize.r, prize.angle, prize.sq, false);
  }

  // Dots that show where the claw will come down.
  function drawGuide(c) {
    if (!canSteer()) return;
    var from = PIVOT_Y + claw.L + HUB_H + 130;
    var to = (claw.target ? claw.target.y - claw.target.r : surfaceBelow(claw.x)) - 10;
    if (to - from < 16) return;
    c.save();
    c.strokeStyle = claw.target ? 'rgba(124, 92, 255, 0.85)' : 'rgba(124, 92, 255, 0.4)';
    c.lineWidth = 6;
    c.lineCap = 'round';
    c.setLineDash([0.1, 17]);
    c.lineDashOffset = -game.time * 34;
    c.beginPath();
    c.moveTo(claw.x, from);
    c.lineTo(claw.x, to);
    c.stroke();
    c.restore();
  }

  // Lights and words on the sign.

  function drawButton(c, b, kind, pressed, live, pulse) {
    var lift = pressed ? 2 : 9;
    var top = !live ? COL.off : (kind === 'drop' ? COL.accent : COL.sign);
    var side = !live ? COL.offDark : (kind === 'drop' ? COL.accentDark : COL.signDark);
    c.save();
    c.translate(b.x, b.y);
    if (pulse > 0) c.scale(1 + 0.05 * pulse, 1 + 0.05 * pulse);
    circle(c, 0, 0, b.r);
    paint(c, side, INK, 5);
    c.translate(0, -lift);
    circle(c, 0, 0, b.r);
    paint(c, top, INK, 5);
    c.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    c.lineWidth = 6;
    c.beginPath();
    c.arc(0, 0, b.r - 13, Math.PI * 1.13, Math.PI * 1.4);
    c.stroke();
    c.globalAlpha = live ? 1 : 0.75;
    if (kind === 'drop') {
      poly(c, [[-11, -48], [11, -48], [11, -24], [31, -24], [0, 8], [-31, -24], [-11, -24]]);
      paint(c, COL.white, INK, 5.5);
      drawText(c, 'DROP', 0, 37, 29, COL.white, INK, 7, 104);
    } else {
      var d = kind === 'left' ? -1 : 1;
      poly(c, [[d * 27, 0], [-d * 17, -29], [-d * 17, 29]]);
      paint(c, COL.white, INK, 5.5);
    }
    c.restore();
  }
  function drawButtons(c) {
    var ready = game.state === 'ready';
    var idle = game.time - game.lastAct;
    var beat = 0.5 + 0.5 * Math.sin(game.time * 5.5);
    var hintMove = ready && !claw.target && idle > 2.5 ? beat : 0;
    var hintDrop = ready && claw.target ? beat : 0;
    var goRight = claw.x < 440;
    drawButton(c, BTN.left, 'left', input.left && canSteer(), canSteer(), goRight ? 0 : hintMove);
    drawButton(c, BTN.right, 'right', input.right && canSteer(), canSteer(), goRight ? hintMove : 0);
    drawButton(c, BTN.drop, 'drop', holding('drop') || game.time - game.dropFlash < 0.16, ready, hintDrop);
  }

  // The prize behind the prize door.
  function drawTray(c) {
    if (game.state !== 'tray' || !prize) return;
    c.save();
    rr(c, DOOR.x, DOOR.y, DOOR.w, DOOR.h, 16);
    c.clip();
    drawToy(c, DOOR.x + DOOR.w / 2, prize.trayY, prize.trayR, prize.angle, prize.sq, false);
    c.restore();
    rr(c, DOOR.x, DOOR.y, DOOR.w, DOOR.h, 16);
    paint(c, null, INK, 5);
  }

  // The celebration after a win.
  function drawWin(c) {
    var s = game.state;
    if (s !== 'win' && s !== 'winOut') {
      if (confetti.length) drawConfetti(c);
      return;
    }
    var t = game.t, p = prize;
    var out = s === 'winOut' ? easeInOut(clamp(t / 0.45, 0, 1)) : 0;
    var fade = s === 'win' ? clamp(t / 0.3, 0, 1) : 1 - out;

    // dark veil over the whole screen
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = 'rgba(46, 27, 128, ' + (0.74 * fade).toFixed(3) + ')';
    c.fillRect(0, 0, canvas.width, canvas.height);
    c.restore();

    // where the prize is right now
    var x, y, r, ang;
    if (s === 'win') {
      var u = clamp(t / 0.7, 0, 1);
      x = lerp(DOOR.x + DOOR.w / 2, SHOW.x, easeOut(u));
      y = lerp(p.trayY, SHOW.y, easeOut(u)) + Math.sin(t * 2.3) * 7 * u;
      r = lerp(p.trayR, SHOW.r, backOut(u));
      ang = lerp(p.showFrom, 0, easeOut(u)) + Math.sin(t * 1.7) * 0.06 * u;
    } else {
      var h = view.hud.count;
      x = lerp(SHOW.x, (h.x + h.h / 2 - view.ox) / view.s, out);
      y = lerp(SHOW.y, (h.y + h.h / 2 - view.oy) / view.s, out);
      r = lerp(SHOW.r, h.h * 0.36 / view.s, out);
      ang = 0;
    }

    // rays behind the prize
    c.save();
    c.globalAlpha = fade;
    c.translate(x, y);
    c.rotate(game.time * 0.28);
    for (var i = 0; i < 12; i++) {
      c.rotate(TAU / 12);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(2600, -342);
      c.lineTo(2600, 342);
      c.closePath();
      c.fillStyle = i % 2 ? 'rgba(255, 255, 255, 0.09)' : 'rgba(255, 214, 90, 0.15)';
      c.fill();
    }
    c.restore();
    c.save();
    c.globalAlpha = fade * 0.22;
    circle(c, x, y, r + 34);
    paint(c, COL.white, null, 0);
    c.restore();

    drawToy(c, x, y, r, ang, p.sq, true);

    if (s === 'win') {
      // message
      var a = clamp((t - 0.3) / 0.45, 0, 1);
      if (a > 0) {
        c.save();
        c.translate(SHOW.x, 190);
        c.rotate(Math.sin(t * 2.1) * 0.025);
        c.scale(backOut(a), backOut(a));
        drawText(c, game.winMsg, 0, 7, 96, null, INK, 22, 720);
        drawText(c, game.winMsg, 0, 0, 96, COL.white, INK, 15, 720);
        c.restore();
      }
      // play again button
      var b = clamp((t - AGAIN_DELAY) / 0.35, 0, 1);
      if (b > 0) {
        var k = backOut(b) * (1 + 0.03 * Math.sin(t * 5));
        var down = holding('again') ? 5 : 0;
        c.save();
        c.translate(AGAIN.x, AGAIN.y);
        c.scale(k, k);
        rr(c, -AGAIN.w / 2, -AGAIN.h / 2 + 9, AGAIN.w, AGAIN.h, AGAIN.h / 2);
        paint(c, COL.goDark, INK, 6);
        rr(c, -AGAIN.w / 2, -AGAIN.h / 2 + down, AGAIN.w, AGAIN.h, AGAIN.h / 2);
        paint(c, COL.go, INK, 6);
        drawText(c, SETTINGS.againLabel, 0, 3 + down, 50, COL.white, INK, 10, AGAIN.w - 70);
        c.restore();
      }
    }
    drawConfetti(c);
  }
  function drawConfetti(c) {
    for (var i = 0; i < confetti.length; i++) {
      var p = confetti[i];
      c.save();
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      c.scale(1, Math.cos(p.flip));
      c.fillStyle = p.col;
      c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      c.restore();
    }
  }

  // Corner buttons and the prize counter, in screen pixels.
  function drawHud(c) {
    var h = view.hud, k = h.u / 60, q, i;
    c.lineJoin = 'round';
    c.lineCap = 'round';

    // prize counter
    q = h.count;
    var pop = 1 + 0.22 * game.countPop;
    c.save();
    c.translate(q.x + q.w / 2, q.y + q.h / 2);
    c.scale(pop, pop);
    rr(c, -q.w / 2, -q.h / 2, q.w, q.h, q.h / 2);
    paint(c, COL.white, INK, 3.5 * k);
    drawToy(c, -q.w / 2 + q.h / 2, 0, q.h * 0.36, 0, 0, false);
    c.font = font(q.h * 0.46);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = INK;
    c.fillText('\u00D7 ' + game.won, -q.w / 2 + q.h + (q.w - q.h) / 2 - q.h * 0.1, q.h * 0.03);
    c.restore();

    // sound button
    q = h.sound;
    circle(c, q.x, q.y, q.r - 2 * k);
    paint(c, COL.white, INK, 3.5 * k);
    c.save();
    c.translate(q.x, q.y);
    c.scale(k, k);
    poly(c, [[-15, -6], [-8, -6], [1, -14], [1, 14], [-8, 6], [-15, 6]]);
    paint(c, INK, INK, 2);
    c.strokeStyle = INK;
    c.lineWidth = 3.6;
    if (snd.on) {
      c.beginPath();
      c.arc(2, 0, 8, -0.95, 0.95);
      c.stroke();
      c.beginPath();
      c.arc(2, 0, 14.5, -0.95, 0.95);
      c.stroke();
    } else {
      c.beginPath();
      c.moveTo(8, -6);
      c.lineTo(18, 6);
      c.moveTo(18, -6);
      c.lineTo(8, 6);
      c.stroke();
    }
    c.restore();

    // full screen button
    q = h.full;
    if (q) {
      var inFs = fsActive();
      circle(c, q.x, q.y, q.r - 2 * k);
      paint(c, COL.white, INK, 3.5 * k);
      c.save();
      c.translate(q.x, q.y);
      c.scale(k, k);
      c.strokeStyle = INK;
      c.lineWidth = 3.8;
      for (i = 0; i < 4; i++) {
        var sx = i === 0 || i === 3 ? -1 : 1, sy = i < 2 ? -1 : 1;
        c.beginPath();
        if (inFs) {
          c.moveTo(sx * 5, sy * 13);
          c.lineTo(sx * 5, sy * 5);
          c.lineTo(sx * 13, sy * 5);
        } else {
          c.moveTo(sx * 13, sy * 5);
          c.lineTo(sx * 13, sy * 13);
          c.lineTo(sx * 5, sy * 13);
        }
        c.stroke();
      }
      c.restore();
    }
  }

  function render() {
    var c = ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1;
    c.drawImage(back, 0, 0);

    useDesign(c);
    c.lineJoin = 'round';
    c.lineCap = 'round';
    c.save();
    c.beginPath();
    c.rect(GLASS.x, GLASS.y, GLASS.w, GLASS.h);
    c.clip();
    drawToys(c);
    drawGuide(c);
    drawClaw(c);
    c.restore();

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(front, view.fx, view.fy);

    useDesign(c);
    drawSign(c);
    drawButtons(c);
    drawTray(c);
    drawWin(c);

    useScreen(c);
    drawHud(c);
  }

  // ------------------------------------------------------------------
  // 13. Main loop
  // ------------------------------------------------------------------
  var lastTime = 0;
  var perf = { wait: 2, time: 0, frames: 0, slowRuns: 0, trial: false, before: 0, prev: 1, locked: false };

  // If the device cannot keep up, draw at a lower resolution.
  // A step down is only kept when it really makes the game smoother,
  // so a screen that simply refreshes slowly keeps its sharp picture.
  function watchSpeed(raw) {
    if (perf.locked || raw > 0.25) return;      // also skips pauses in a background tab
    if (perf.wait > 0) { perf.wait -= raw; return; }
    perf.time += raw;
    perf.frames++;
    if (perf.time < 1.5) return;
    var avg = perf.time / perf.frames;
    perf.time = 0;
    perf.frames = 0;
    if (perf.trial) {
      perf.trial = false;
      if (avg > perf.before * 0.85) {           // no real gain: go back and stop trying
        view.quality = perf.prev;
        perf.locked = true;
        needResize = true;
        return;
      }
    }
    perf.slowRuns = avg > 0.024 ? perf.slowRuns + 1 : 0;
    if (perf.slowRuns >= 2 && view.quality > 0.6) {
      perf.slowRuns = 0;
      perf.before = avg;
      perf.prev = view.quality;
      perf.trial = true;
      perf.wait = 0.6;
      view.quality *= 0.75;
      needResize = true;
    }
  }

  function frame(now) {
    window.requestAnimationFrame(frame);
    var raw = (now - lastTime) / 1000;
    lastTime = now;
    if (!(raw > 0)) return;
    watchSpeed(raw);
    if (canvas.clientWidth !== view.cw || canvas.clientHeight !== view.ch ||
        (window.devicePixelRatio || 1) !== view.dprSeen) needResize = true;
    if (needResize) {
      needResize = false;
      resize();
    }
    update(Math.min(raw, 0.05));
    render();
  }

  function boot() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d', { alpha: false });
    pickFont();
    bindInput();
    fillMachine();

    var started = false;
    function begin() {
      if (started) { needResize = true; return; }
      started = true;
      resize();
      needResize = false;
      render();
      canvas.style.visibility = 'visible';
      lastTime = window.performance && performance.now ? performance.now() : 0;
      window.requestAnimationFrame(frame);
    }
    // The toy picture is stored as text at the bottom of the page.
    var holder = document.getElementById('toy-art');
    var data = holder ? holder.textContent.replace(/\s+/g, '') : '';
    toyImg = new Image();
    toyImg.onload = function () { toyReady = true; begin(); };
    toyImg.onerror = function () { toyReady = false; begin(); };
    if (data) toyImg.src = 'data:image/png;base64,' + data; else begin();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
